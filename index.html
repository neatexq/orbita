<!doctype html>

<head>
<meta charset="utf-8">
<script>
// сайт переехал на свой сервер: со старого адреса переносим игрока вместе с сохранениями
(function(){var S="https://orbita.129-151-216-221.sslip.io/";try{
if(/\.github\.io$/.test(location.hostname)){var m={},n=0;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^orb/.test(k)){m[k]=localStorage.getItem(k);n++}}
var h=n?encodeURIComponent(JSON.stringify(m)):"";location.replace(S+location.search+(h&&h.length<400000?"#mig="+h:""));return}
if(location.hash.indexOf("#mig=")===0){var d=JSON.parse(decodeURIComponent(location.hash.slice(5)));for(var k2 in d)if(/^orb/.test(k2)&&localStorage.getItem(k2)==null)localStorage.setItem(k2,String(d[k2]));history.replaceState(null,"",location.pathname+location.search)}
}catch(e){if(/\.github\.io$/.test(location.hostname))location.replace(S+location.search)}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Орбита · ежедневный запуск</title>
<script>
// язык: ?lang=ru|en → сохранённый выбор → есть старые сохранения (значит, русский) → язык браузера; выбор запоминаем
(function(){var l=null,ls=null;try{ls=window.localStorage}catch(e){}
try{var u=(new URLSearchParams(location.search).get("lang")||"").toLowerCase();if(u==="ru"||u==="en")l=u}catch(e){}
if(!l)try{var s=JSON.parse(ls.getItem("orb-lang"));if(s==="ru"||s==="en")l=s}catch(e){}
if(!l)try{for(var i=0;i<ls.length;i++)if(/^orb-(pid|d-|du-|nick|endless)/.test(ls.key(i))){l="ru";break}}catch(e){}
if(!l)l=/^ru/i.test(navigator.language||"")?"ru":"en";
try{ls.setItem("orb-lang",JSON.stringify(l))}catch(e){}
window.ORB_LANG=l;document.documentElement.lang=l;if(l==="en"){document.documentElement.classList.add("i18n");document.title="Orbit · daily launch"}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eaf6ff;--muted:#8fb3d1;--panel:rgba(6,14,34,.82);--line:#2c5f93;--hot:#ff4f8b;--cy:#5ff3ff;--gold:#ffd54a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#02030a}
body{color:var(--ink);font-family:"JetBrains Mono",monospace;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated}
.px{font-family:"Press Start 2P",monospace}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
.hidden{display:none!important}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}

/* кнопки */
.btn{font-family:"Press Start 2P";font-size:12px;letter-spacing:1px;color:var(--ink);background:var(--panel);border:2px solid var(--cy);padding:14px 16px;cursor:pointer;box-shadow:0 0 0 2px #000,0 0 18px rgba(95,243,255,.25),inset 0 0 18px rgba(95,243,255,.12);transition:transform .08s,box-shadow .2s,background .2s;position:relative}
.btn:hover{background:rgba(20,50,90,.9);box-shadow:0 0 0 2px #000,0 0 28px rgba(95,243,255,.5),inset 0 0 24px rgba(95,243,255,.2)}
.btn:active{transform:translateY(2px)}
.btn.small{font-size:9px;padding:10px 12px;border-color:var(--line);box-shadow:0 0 0 2px #000}
.btn.hot{border-color:var(--hot);box-shadow:0 0 0 2px #000,0 0 22px rgba(255,79,139,.35),inset 0 0 18px rgba(255,79,139,.15)}
.btn.big{font-size:clamp(13px,2.6vw,18px);padding:20px 22px;width:100%}
.btn.big::after{content:"";position:absolute;inset:-6px;border:2px solid var(--cy);opacity:0;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.08,1.4)}}

/* верхние кнопки */
.i18n [data-i]{visibility:hidden}
#langSw{display:flex;gap:6px;margin-top:14px;pointer-events:auto}
#langSw button,.langRow button{font-family:"Press Start 2P";font-size:9px;letter-spacing:1px;padding:7px 10px;color:#bcd8ef;background:rgba(2,6,20,.55);border:2px solid var(--line);box-shadow:0 0 0 2px #000;cursor:pointer}
#langSw button.on,.langRow button.on{color:#fff;border-color:var(--cy);box-shadow:0 0 0 2px #000,0 0 12px rgba(95,243,255,.45)}
.langRow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-family:"Press Start 2P";font-size:9px;color:#bcd8ef}
.langRow div{display:flex;gap:6px}
#topBtns{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:20}
#topBtns .btn{pointer-events:auto;width:40px;height:40px;padding:0;font-size:14px}

/* главная */
#home{display:flex;flex-direction:column;align-items:center;padding:clamp(40px,8vh,90px) 16px 20px}
.title{font-family:"Press Start 2P";font-size:clamp(38px,10vw,96px);letter-spacing:6px;color:#fff;position:relative;text-shadow:3px 0 var(--hot),-3px 0 var(--cy),0 0 30px rgba(255,255,255,.35);animation:glitch 4s infinite steps(1)}
@keyframes glitch{0%,92%,100%{text-shadow:3px 0 var(--hot),-3px 0 var(--cy),0 0 30px rgba(255,255,255,.35);transform:none}
93%{text-shadow:-6px 0 var(--hot),6px 0 var(--cy);transform:translateX(3px) skewX(-6deg)}
95%{text-shadow:8px 2px var(--hot),-8px -2px var(--cy);transform:translateX(-4px)}
97%{text-shadow:2px 0 var(--hot),-2px 0 var(--cy);transform:skewX(4deg)}}
.tag{font-family:"Press Start 2P";font-size:clamp(10px,2vw,14px);color:var(--cy);letter-spacing:6px;margin-top:14px;text-shadow:0 0 10px var(--cy)}
.sub{font-size:13px;color:#fff;margin-top:14px;text-shadow:0 1px 0 #000,0 0 6px #000,0 0 12px rgba(0,0,0,.6);text-align:center}
#homeBottom{position:absolute;left:50%;bottom:clamp(16px,4vh,40px);transform:translateX(-50%);width:min(560px,calc(100% - 32px))}
.rowBtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rowBtns .btn{flex:1}
.meta{display:flex;justify-content:space-between;font-family:"Press Start 2P";font-size:8px;color:#bcd8ef;margin-top:10px;text-shadow:0 1px 0 #000}
#howLink{font-family:"Press Start 2P";font-size:9px;color:#dff3ff;background:none;border:none;cursor:pointer;margin-bottom:10px;text-shadow:0 1px 0 #000;letter-spacing:1px}
#howLink:hover{color:var(--cy)}

/* HUD */
#hud{position:fixed;top:12px;left:62px;right:62px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
.hbox{background:var(--panel);border:2px solid var(--line);padding:8px 12px;min-width:120px;box-shadow:0 0 0 2px #000;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hbox small{display:block;font-family:"Press Start 2P";font-size:7px;color:var(--muted);letter-spacing:2px}
.hbox b{font-family:"Press Start 2P";font-size:clamp(13px,2.4vw,20px);color:var(--cy);display:block;margin-top:6px;text-shadow:0 0 10px rgba(95,243,255,.6)}
#hScore b{color:var(--hot);text-shadow:0 0 10px rgba(255,79,139,.6)}
#hScore{text-align:right}
#pips{display:flex;flex-direction:column;align-items:center;gap:6px}
#pips .row{display:flex;gap:4px}
#pips i{width:14px;height:14px;border:2px solid var(--line);background:#071225;display:block;transition:all .3s}
#pips i.cur{border-color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{background:#244a77}}
#pips span{font-family:"Press Start 2P";font-size:7px;color:var(--muted);letter-spacing:1px}

/* карточка вопроса */
#pcard{position:fixed;left:50%;top:22%;transform:translate(-50%,0);width:min(620px,calc(100% - 32px));background:var(--panel);border:2px solid var(--line);padding:18px 22px;box-shadow:0 0 0 2px #000,0 10px 40px rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:5}
#pcard .qn{font-family:"Press Start 2P";font-size:8px;color:var(--hot);letter-spacing:2px}
#pcard .qt{font-family:"Press Start 2P";font-size:clamp(14px,3.2vw,22px);line-height:1.55;margin:14px 0 12px;color:#fff}
#pcard .qh{font-size:11px;color:var(--muted);letter-spacing:1px}
.in{animation:cardIn .6s cubic-bezier(.16,1,.3,1) both}
@keyframes cardIn{0%{opacity:0;transform:translate(-50%,26px) scale(.94);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:translate(-50%,0) scale(1);filter:none}}
.out{animation:cardOut .34s cubic-bezier(.55,0,.85,.35) both}
@keyframes cardOut{to{opacity:0;transform:translate(-50%,-36px) scale(.96);filter:blur(5px)}}
.typed{border-right:2px solid var(--cy);animation:caret .7s infinite}
@keyframes caret{50%{border-color:transparent}}

/* ввод */
#bar{position:fixed;left:50%;bottom:clamp(14px,4vh,36px);transform:translateX(-50%);width:min(620px,calc(100% - 32px));display:flex;gap:10px;align-items:center;z-index:6}
#ring{width:58px;height:58px;flex:none;position:relative}
#ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:5}
#ring .bg{stroke:#0b1e3a}
#ring .fg{stroke:var(--cy);stroke-linecap:butt;transition:stroke .3s;filter:drop-shadow(0 0 4px currentColor)}
#ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:"Press Start 2P";font-size:14px;color:var(--cy)}
#ring.low .fg{stroke:var(--hot)}#ring.low span{color:var(--hot);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.25)}}
#ans{flex:1;min-width:0;height:58px;font:700 18px "JetBrains Mono";background:var(--panel);color:#fff;border:2px solid var(--line);padding:0 14px;outline:none;box-shadow:0 0 0 2px #000}
#ans:focus{border-color:var(--cy);box-shadow:0 0 0 2px #000,0 0 20px rgba(95,243,255,.3)}
#ans.bad{animation:shake .4s;border-color:var(--hot)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#go{height:58px}
#err{position:fixed;left:50%;bottom:calc(clamp(14px,4vh,36px) + 70px);transform:translateX(-50%);font-family:"Press Start 2P";font-size:9px;color:var(--hot);text-shadow:0 0 8px var(--hot),0 1px 0 #000;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:6}
#err.on{opacity:1}
#err.chk{color:var(--cy);text-shadow:0 0 8px var(--cy),0 1px 0 #000;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#res .fix{font-size:12px;color:var(--cy);margin-top:8px}
#count{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Press Start 2P";font-size:clamp(40px,10vw,90px);color:#fff;text-shadow:4px 0 var(--hot),-4px 0 var(--cy);pointer-events:none;z-index:7}
.pop{animation:pop .9s ease-out both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}

/* результат вопроса */
#res{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));text-align:center;z-index:8}
#res .tn{font-family:"Press Start 2P";font-size:clamp(22px,5.5vw,42px);letter-spacing:2px;line-height:1.3}
#res .ta{font-family:"Press Start 2P";font-size:12px;margin-top:16px;color:#fff}
#res .tp{font-family:"Press Start 2P";font-size:11px;margin-top:14px;color:var(--cy)}
#res .tf{font-size:13px;color:#cfe3f5;margin-top:10px;font-style:italic}
#res .bars{margin:18px auto 0;max-width:420px;text-align:left;background:var(--panel);border:2px solid var(--line);padding:12px;box-shadow:0 0 0 2px #000}
#res .bars h4{font-family:"Press Start 2P";font-size:7px;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
.b{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.b .tr{position:relative;height:20px;background:#081428;overflow:hidden}
.b .fl{position:absolute;inset:0 auto 0 0;width:0;background:#1d4a7a;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.b.me .fl{background:linear-gradient(90deg,var(--hot),#ff9ac0)}
.b .bl{position:relative;padding:0 8px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b .pc{text-align:right;color:var(--muted);font-size:11px}
#res .btn{margin-top:18px;min-width:220px}
.rise{animation:rise .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
.rainbow{background:linear-gradient(90deg,#ff4fd8,#ffd54a,#5ef38c,#5ff3ff,#c77dff,#ff4fd8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rb 2s linear infinite;filter:drop-shadow(0 0 12px rgba(255,79,216,.6))}
@keyframes rb{to{background-position:300% 0}}

/* итог */
#end{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border:2px solid var(--cy);padding:22px;box-shadow:0 0 0 2px #000,0 0 50px rgba(95,243,255,.25);z-index:8;scrollbar-width:thin}
#end h2{font-family:"Press Start 2P";font-size:11px;color:var(--hot);letter-spacing:2px}
#end .alt{font-family:"Press Start 2P";font-size:clamp(30px,8vw,52px);color:#fff;margin:14px 0 6px;text-shadow:3px 0 var(--hot),-3px 0 var(--cy)}
#end .lm{font-size:12px;color:var(--cy)}
#end .dsum{font-size:12px;color:var(--gold);margin-top:10px;line-height:1.6;animation:rise .6s cubic-bezier(.2,1.3,.4,1) both}
#end .grid{font-size:22px;letter-spacing:4px;margin:12px 0}
#end table{width:100%;border-collapse:collapse;margin-top:6px}
#end td{padding:7px 4px;border-bottom:1px dashed #1f4670;font-size:12px;vertical-align:top}
#end td.p{text-align:right;font-family:"Press Start 2P";font-size:10px;white-space:nowrap}
#end td small{color:var(--muted)}
#end .next{font-family:"Press Start 2P";font-size:8px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.8}

/* модалка */
#modal{position:fixed;inset:0;background:rgba(0,3,12,.72);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;padding:16px}
#mbox{width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#06102a;border:2px solid var(--cy);padding:20px;box-shadow:0 0 0 2px #000,0 0 50px rgba(95,243,255,.25);animation:rise .4s cubic-bezier(.2,1.3,.4,1)}
#mbox h3{font-family:"Press Start 2P";font-size:12px;color:var(--cy);margin-bottom:14px;letter-spacing:2px}
#mbox .rules li{list-style:none;font-family:"Press Start 2P";font-size:9px;line-height:1.7;color:#dcefff;padding:6px 0}
#mbox .rules li::before{content:"▲ ";color:var(--hot)}
.cardPrev{display:grid;place-items:center;min-height:160px;margin-bottom:12px}.cardPrev img{display:block;max-width:100%;max-height:min(50vh,540px);border:2px solid var(--line);box-shadow:0 0 0 2px #000}
.shBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shBtns .btn{padding:12px 8px;font-size:10px}.shBtns .btn.small{font-size:9px}.shBtns .btn[hidden]{display:none}.shBtns #shSend{grid-column:1/-1}.shBtns .btn:disabled{opacity:.5;cursor:default}
.tierList{margin-top:12px;display:grid;gap:5px}
.tierList div{display:flex;justify-content:space-between;font-family:"Press Start 2P";font-size:8px;padding:6px 8px;background:#0a1836}
.mlist{display:grid;gap:8px}
.mlist .btn{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.mlist .btn small{font-family:"JetBrains Mono";font-size:11px;color:var(--muted);letter-spacing:0}
.ico{display:inline-block;vertical-align:middle;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 3px rgba(95,243,255,.25))}
.btn .ico{margin:-3px 6px 0 0}
#topBtns .btn{display:grid;place-items:center}
#topBtns .btn .ico{margin:0}
.mlist .btn span{display:flex;align-items:center;gap:10px}
.mlist .btn span .ico{margin:0}
.tbadge{display:inline-grid;place-items:center;border:2px solid;vertical-align:middle;clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px)}
.tbadge .ico{filter:none}
.tb100{animation:tbglow 1.2s infinite alternate}
@keyframes tbglow{to{box-shadow:0 0 18px #ff4fd8,0 0 4px #ffd54a}}
#end .grid{display:flex;gap:8px;justify-content:flex-start;letter-spacing:0;flex-wrap:wrap}
#res .resBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#res .resBtns .btn{min-width:170px}
#end .grid>span{animation:rise .5s cubic-bezier(.2,1.4,.4,1) both}
#end td.b0{width:22px;padding-right:2px}
.tierList span{display:flex;align-items:center;gap:8px}
#streakTxt .ico{margin-top:-3px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);font-family:"Press Start 2P";font-size:9px;background:var(--hot);color:#fff;padding:10px 14px;box-shadow:0 0 0 2px #000;opacity:0;transition:.3s;z-index:40;pointer-events:none}
#toast.on{opacity:1}
body.shake canvas,body.shake #res{animation:bshake .5s}
body.shake2 canvas,body.shake2 #res{animation:bshake2 .9s}
@keyframes bshake{10%,50%,90%{transform:translate(-4px,2px)}30%,70%{transform:translate(4px,-2px)}}
@keyframes bshake2{10%,40%,70%{transform:translate(-10px,5px) rotate(-.5deg)}25%,55%,85%{transform:translate(10px,-5px) rotate(.5deg)}}
/* дуэль */
#opp{position:fixed;top:84px;right:12px;z-index:10;pointer-events:none;text-align:right}
#opp b{font-size:clamp(10px,1.8vw,13px);color:var(--gold);text-shadow:0 0 10px rgba(255,213,74,.5)}
.nick{width:100%;height:46px;font:700 16px "JetBrains Mono";background:var(--panel);color:#fff;border:2px solid var(--line);padding:0 12px;outline:none;box-shadow:0 0 0 2px #000;text-transform:none}
.nick:focus{border-color:var(--cy)}
#mbox label,#end label{display:block;font-family:"Press Start 2P";font-size:8px;color:var(--muted);letter-spacing:2px;margin:12px 0 8px}
.dcode{font-family:"Press Start 2P";font-size:clamp(26px,7vw,40px);letter-spacing:8px;color:#fff;text-align:center;margin:10px 0;text-shadow:3px 0 var(--hot),-3px 0 var(--cy)}
.dlink{font-size:11px;color:var(--cy);word-break:break-all;text-align:center;background:#0a1836;padding:8px}
.dvs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:14px 0 4px}
.dvs .hbox{min-width:0;text-align:center}
.dvs .hbox.win{border-color:var(--gold);box-shadow:0 0 0 2px #000,0 0 18px rgba(255,213,74,.45)}
.dvs .hbox b{font-size:clamp(14px,3.6vw,22px)}
.dvs .hbox small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvs>span{font-family:"Press Start 2P";font-size:12px;color:var(--hot)}
.dwin{font-family:"Press Start 2P";font-size:clamp(16px,4.4vw,26px);text-align:center;margin-top:12px;line-height:1.4}
#end table.dt td{width:50%}
#end table.dt tr.dq td{border-bottom:none;padding-bottom:0;color:#dcefff;font-size:11px}
#end table.dt td .dp{float:right;font-family:"Press Start 2P";font-size:9px;margin-left:6px}
/* комната */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:48px;padding:10px 6px}
.seg .btn.on{border-color:var(--hot);color:#fff;background:rgba(255,79,139,.22);box-shadow:0 0 0 2px #000,0 0 14px rgba(255,79,139,.45)}
.seg .btn:disabled{cursor:default}
select.nick{appearance:none;-webkit-appearance:none;cursor:pointer;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--cy) 50%),linear-gradient(135deg,var(--cy) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select.nick option{background:#06102a;color:#fff}
.rlab{display:block;font-family:"Press Start 2P";font-size:8px;color:var(--muted);letter-spacing:2px;margin:16px 0 8px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.plist span{font-family:"Press Start 2P";font-size:9px;padding:8px 10px;background:#0a1836;border:2px solid var(--line);box-shadow:0 0 0 2px #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist span.nw{animation:rise .4s cubic-bezier(.2,1.3,.4,1) both}
.plist span.me{border-color:var(--cy);color:var(--cy)}
.plist span.off{opacity:.4}
.plist span .ico{margin:-3px 6px 0 0}
.rset{font-family:"Press Start 2P";font-size:9px;color:#dcefff;line-height:1.8;text-align:center;margin-top:6px}
.rbig{font-family:"Press Start 2P";font-size:clamp(18px,5vw,30px);text-align:center;margin:14px 0 6px;line-height:1.3}
.rq{font-family:"Press Start 2P";font-size:clamp(10px,2.4vw,13px);color:#fff;line-height:1.6;margin-top:10px}
.rme{text-align:center;font-size:12px;color:#dcefff}
.rme b{font-family:"Press Start 2P";font-size:11px}
.rrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px dashed #1f4670;font-size:12px;animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
.rrow .nm{font-family:"Press Start 2P";font-size:8px;color:var(--muted);display:block;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.me .nm{color:var(--cy)}
.rrow .an{word-break:break-word}
.rrow .an small{color:var(--muted)}
.rrow .pt{font-family:"Press Start 2P";font-size:10px;white-space:nowrap;text-align:right}
.uq{display:inline-block;font-family:"Press Start 2P";font-size:7px;color:#2a0f3a;background:var(--gold);padding:3px 5px;margin-left:6px;vertical-align:1px;animation:tbglow 1.2s infinite alternate;white-space:nowrap}
.lb{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;padding:7px 2px;border-bottom:1px dashed #1f4670}
.lb .pl{font-family:"Press Start 2P";font-size:10px;color:var(--muted)}
.lb .pl.g1{color:var(--gold)}.lb .pl.g2{color:#cfe3f5}.lb .pl.g3{color:#ff8a2e}
.lb .nm{font-family:"Press Start 2P";font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb.me .nm{color:var(--cy)}
.lb .dl{font-family:"Press Start 2P";font-size:8px;color:var(--gold)}
.lb .sc{font-family:"Press Start 2P";font-size:10px;color:var(--hot);white-space:nowrap}
.rtimer{height:4px;background:#0b1e3a;margin-top:14px;overflow:hidden}
.rtimer i{display:block;height:100%;background:var(--cy);box-shadow:0 0 8px var(--cy)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:18px 0 6px}
.pod{flex:1;max-width:150px;min-width:0;text-align:center}
.pod .pn{font-family:"Press Start 2P";font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
.pod .ps{font-size:12px;font-weight:700;color:var(--cy);margin-bottom:6px}
.pod .pb{font-family:"Press Start 2P";font-size:22px;display:grid;place-items:center;border:2px solid;box-shadow:0 0 0 2px #000;transform-origin:bottom;animation:podUp .9s cubic-bezier(.2,1.3,.4,1) both}
.pod.p1 .pb{height:100px;background:rgba(255,213,74,.16);border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px #000,0 0 22px rgba(255,213,74,.35)}
.pod.p2 .pb{height:70px;background:rgba(220,235,255,.1);border-color:#cfe3f5;color:#cfe3f5;animation-delay:.25s}
.pod.p3 .pb{height:48px;background:rgba(255,138,46,.13);border-color:#ff8a2e;color:#ff8a2e;animation-delay:.45s}
.pod.me .pn{color:var(--cy)}
@keyframes podUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#end .rowBtns .btn{white-space:nowrap}
#end details{margin-top:12px}
#end summary{font-family:"Press Start 2P";font-size:8px;color:var(--cy);cursor:pointer;letter-spacing:1px;padding:6px 0}
/* рейтинг дня */
#lbBox{margin-top:6px}
.lbhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 0 4px}
.lbhead b{font-family:"Press Start 2P";font-size:9px;color:var(--hot);letter-spacing:2px;font-weight:400}
.lbhead small{font-family:"Press Start 2P";font-size:7px;color:var(--muted);white-space:nowrap}
.lbme{font-family:"Press Start 2P";font-size:clamp(15px,4vw,22px);color:#fff;text-align:center;margin:12px 0 4px;text-shadow:2px 0 var(--hot),-2px 0 var(--cy);animation:rise .6s cubic-bezier(.2,1.3,.4,1) both}
.lbnote{font-size:11px;color:var(--muted);text-align:center;margin-bottom:6px}
.lr{display:grid;grid-template-columns:34px minmax(0,1fr) auto 64px;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px dashed #1f4670}
.lr .pl{font-family:"Press Start 2P";font-size:9px;color:var(--muted)}
.lr .pl.g1{color:var(--gold)}.lr .pl.g2{color:#cfe3f5}.lr .pl.g3{color:#ff8a2e}
.lr .nm{font-family:"Press Start 2P";font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .nm.anon{color:var(--muted)}
.lr .nm small{font-family:"JetBrains Mono";font-size:10px;color:var(--muted)}
.lr .tb{display:flex;gap:2px}
.lr .tb .tbadge{border-width:1px}
.lr .sc{font-family:"Press Start 2P";font-size:9px;color:var(--hot);white-space:nowrap;text-align:right}
.lr.me{background:rgba(95,243,255,.1);box-shadow:inset 3px 0 var(--cy)}
.lr.me .nm{color:var(--cy)}
.lr.gap{display:block;text-align:center;color:var(--muted);font-family:"Press Start 2P";font-size:9px;padding:6px;border-bottom:none}
.lbtabs{margin-bottom:4px}
@media (max-width:600px){
  #homeBottom .rowBtns .btn{padding:10px 6px;font-size:8px}
  .lb{grid-template-columns:26px 1fr auto auto;gap:6px}
  #end{padding:16px}
  #end .rowBtns .btn{font-size:10px;padding:12px 8px}
  .lr{grid-template-columns:28px minmax(0,1fr) auto 54px;gap:6px;padding:7px 2px}
  .lr .nm,.lr .sc{font-size:8px}
  .lr .tb{gap:1px}.lr .tb .tbadge{width:8px!important;height:8px!important}
  #hud{left:58px;right:58px}
  .hbox{min-width:0;padding:6px 8px}
  #pips i{width:9px;height:9px}
  #pcard{top:16%}
  #ring{width:50px;height:50px}#ans,#go{height:50px}
  #go{padding:0 10px;font-size:10px}
  #err{white-space:normal;width:90%;text-align:center}
}

/* =================== ПОЛИРОВКА ИНТЕРФЕЙСА =================== */
:root{--pbg:linear-gradient(180deg,rgba(13,30,66,.95),rgba(5,11,28,.95));--ease:cubic-bezier(.16,1,.3,1);--dash:rgba(44,95,147,.55)}
/* общий вид панелей: тёмный градиент, рамка 2px, чёрный контур и уголки-скобки (фон, поэтому не уезжают при прокрутке) */
#pcard,#mbox,#end,#res .bars{--bk:var(--cy);background:
 linear-gradient(var(--bk),var(--bk)) 0 0/14px 3px no-repeat,linear-gradient(var(--bk),var(--bk)) 0 0/3px 14px no-repeat,
 linear-gradient(var(--bk),var(--bk)) 100% 0/14px 3px no-repeat,linear-gradient(var(--bk),var(--bk)) 100% 0/3px 14px no-repeat,
 linear-gradient(var(--bk),var(--bk)) 0 100%/14px 3px no-repeat,linear-gradient(var(--bk),var(--bk)) 0 100%/3px 14px no-repeat,
 linear-gradient(var(--bk),var(--bk)) 100% 100%/14px 3px no-repeat,linear-gradient(var(--bk),var(--bk)) 100% 100%/3px 14px no-repeat,var(--pbg)}
.hbox{background:var(--pbg)}
#mbox,#end{scrollbar-width:thin;scrollbar-color:var(--line) rgba(0,0,0,.35)}
#mbox::-webkit-scrollbar,#end::-webkit-scrollbar{width:8px}
#mbox::-webkit-scrollbar-thumb,#end::-webkit-scrollbar-thumb{background:var(--line);border:2px solid #06102a}
#mbox::-webkit-scrollbar-track,#end::-webkit-scrollbar-track{background:rgba(0,0,0,.35)}

/* кнопки: подъём и блик при наведении, вдавливание при нажатии */
.btn{line-height:1.3;background:linear-gradient(180deg,rgba(20,46,90,.94),rgba(6,14,34,.94));transition:transform .16s var(--ease),box-shadow .2s,background .2s,border-color .2s,color .2s,filter .2s,opacity .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-shadow:0 1px 0 #000}
.btn::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.34) 50%,transparent 58%) no-repeat;background-size:300% 100%;background-position:100% 0}
@keyframes sheen{0%{opacity:1;background-position:100% 0}100%{opacity:1;background-position:0 0}}
@media (hover:hover){
  .btn:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(180deg,rgba(30,70,124,.96),rgba(10,24,54,.96));box-shadow:0 0 0 2px #000,0 4px 0 rgba(0,0,0,.45),0 0 32px rgba(95,243,255,.55),inset 0 0 26px rgba(95,243,255,.25)}
  .btn.hot:hover:not(:disabled){background:linear-gradient(180deg,rgba(90,24,62,.96),rgba(34,8,30,.96));box-shadow:0 0 0 2px #000,0 4px 0 rgba(0,0,0,.45),0 0 32px rgba(255,79,139,.6),inset 0 0 24px rgba(255,79,139,.28)}
  .btn.small:hover:not(:disabled){border-color:var(--cy);box-shadow:0 0 0 2px #000,0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(95,243,255,.4)}
  .btn.small.hot:hover:not(:disabled),.seg .btn.on:hover:not(:disabled){border-color:var(--hot);box-shadow:0 0 0 2px #000,0 3px 0 rgba(0,0,0,.45),0 0 20px rgba(255,79,139,.5)}
  .btn:hover:not(:disabled)::before{animation:sheen .6s ease-out}
  .mlist .btn:hover:not(:disabled){transform:translateX(4px)}
}
.btn:active:not(:disabled),.mlist .btn:active:not(:disabled){transform:translateY(2px);transition-duration:.05s;filter:brightness(.9);box-shadow:0 0 0 2px #000,0 0 6px rgba(95,243,255,.18),inset 0 3px 12px rgba(0,0,0,.55)}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.25);box-shadow:0 0 0 2px #000}
.btn.big:disabled::after{animation:none;opacity:0}
.btn:focus-visible{outline:2px dashed var(--gold);outline-offset:3px}
.btn.big{letter-spacing:2px;text-shadow:0 0 12px rgba(95,243,255,.6),0 2px 0 #000}
.seg .btn{min-height:40px}
.seg .btn.on{background:linear-gradient(180deg,rgba(255,79,139,.34),rgba(255,79,139,.14))}
.seg .btn.on:disabled{opacity:.85}
#howLink{padding:6px 2px;transition:color .2s,text-shadow .2s}
#howLink:hover{text-shadow:0 0 10px var(--cy),0 1px 0 #000}

/* поля ввода */
#ans,.nick:not(select){background:linear-gradient(180deg,rgba(3,8,22,.96),rgba(10,24,54,.94))}
#ans,.nick{transition:border-color .2s,box-shadow .2s}
#ans::placeholder,.nick::placeholder{color:#55789a;opacity:1}
.nick:focus{box-shadow:0 0 0 2px #000,0 0 18px rgba(95,243,255,.3)}
#ans:disabled{opacity:.6}

/* главная: появление по очереди */
.sub{line-height:1.55}
#home .title{animation:homeIn .8s var(--ease) both,glitch 4s 1.2s infinite steps(1)}
#home .tag{animation:homeIn .7s .14s var(--ease) both}
#home .sub{animation:homeIn .7s .26s var(--ease) both}
#homeBottom{animation:homeUp .7s .34s var(--ease) both}
@keyframes homeIn{from{opacity:0;transform:translateY(-14px);filter:blur(4px)}}
@keyframes homeUp{from{opacity:0;transform:translate(-50%,24px)}to{opacity:1;transform:translate(-50%,0)}}
#homeBottom .rowBtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.meta{margin-top:12px;letter-spacing:1px}

/* появление экранов (анимация запускается каждый раз, когда снимается .hidden) */
#hud{animation:hudIn .5s var(--ease) both}
@keyframes hudIn{from{opacity:0;transform:translateY(-16px)}}
#bar{animation:barIn .5s var(--ease) both}
@keyframes barIn{from{opacity:0;transform:translate(-50%,26px)}to{opacity:1;transform:translate(-50%,0)}}
#res{animation:fadeIn .3s ease-out both}
#end:not([data-v=lobby]){animation:endIn .5s var(--ease) both}
@keyframes endIn{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
#opp{animation:oppIn .45s var(--ease) both}
@keyframes oppIn{from{opacity:0;transform:translateX(24px)}}
@keyframes fadeIn{from{opacity:0}}
/* тряска результата не сбивает его центровку */
body.shake #res{animation:rshake .5s}
body.shake2 #res{animation:rshake2 .9s}
@keyframes rshake{10%,50%,90%{transform:translate(calc(-50% - 4px),calc(-50% + 2px))}30%,70%{transform:translate(calc(-50% + 4px),calc(-50% - 2px))}}
@keyframes rshake2{10%,40%,70%{transform:translate(calc(-50% - 10px),calc(-50% + 5px)) rotate(-.5deg)}25%,55%,85%{transform:translate(calc(-50% + 10px),calc(-50% - 5px)) rotate(.5deg)}}

/* HUD */
.hbox{padding:8px 12px 9px}
.hbox small{line-height:1.2}
.hbox b{line-height:1.15;white-space:nowrap}
#hAlt{box-shadow:0 0 0 2px #000,inset 0 -2px 0 rgba(95,243,255,.35)}
#hScore{box-shadow:0 0 0 2px #000,inset 0 -2px 0 rgba(255,79,139,.35)}
#pips{padding-top:2px}
#pips span{text-shadow:0 1px 0 #000;white-space:nowrap}
#pips i{box-shadow:0 0 0 1px #000}
#opp{border-color:rgba(255,213,74,.6)}
#opp small{color:#e8d9a0}

/* карточка вопроса */
#pcard{padding:18px 22px 16px;border-color:rgba(44,95,147,.95);box-shadow:0 0 0 2px #000,0 14px 44px rgba(0,0,0,.55),0 0 30px rgba(95,243,255,.08)}
#pcard::before{content:"";position:absolute;left:18px;right:18px;top:-2px;height:2px;background:linear-gradient(90deg,transparent,var(--cy),transparent);box-shadow:0 0 10px var(--cy)}
#pcard::after{content:"";position:absolute;left:-2px;top:18px;bottom:18px;width:3px;background:linear-gradient(180deg,var(--hot),rgba(255,79,139,.1));box-shadow:0 0 8px rgba(255,79,139,.5)}
#pcard .qn{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:6px 10px 5px 8px;line-height:1.5;color:#fff;letter-spacing:1.5px;background:linear-gradient(90deg,rgba(255,79,139,.34),rgba(255,79,139,.06));border-left:3px solid var(--hot);text-shadow:0 1px 0 #000}
#pcard .qn:empty{display:none}
#pcard .qn::before{content:"";flex:none;width:6px;height:6px;background:var(--hot);box-shadow:0 0 6px var(--hot);animation:dotb 1.2s steps(2) infinite}
@keyframes dotb{50%{opacity:.2}}
#pcard .qt{line-height:1.65;margin:14px 0;text-shadow:0 2px 0 #000;min-height:1.65em}
#pcard .qh{line-height:1.5;padding-top:10px;border-top:1px dashed var(--dash)}

/* кольцо таймера: сегменты, плавный цвет, тревога в последние 5 секунд */
#ring{--rc:var(--cy);border-radius:50%;background:radial-gradient(circle,rgba(4,10,26,.92) 0 62%,transparent 64%)}
#ring .bg{stroke:#0b1e3a}
#ring .fg{stroke:var(--rc);transition:stroke-dashoffset .1s linear;filter:drop-shadow(0 0 4px var(--rc))}
#ring .tk{fill:none;stroke:#040a1a;stroke-width:7;stroke-dasharray:1.1 5.4345}
#ring span{color:var(--rc);text-shadow:0 0 8px var(--rc),0 2px 0 #000;transition:color .2s}
#ring.low .fg{stroke:var(--rc)}
#ring.low{animation:ringPulse 1s ease-in-out infinite}
#ring.low span{color:var(--rc);animation:beat 1s cubic-bezier(.2,1.6,.4,1) infinite}
@keyframes beat{0%{transform:scale(1)}12%{transform:scale(1.35)}40%{transform:scale(1)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,79,139,.65)}8%{transform:translateX(-1px) rotate(-2deg)}16%{transform:translateX(1px) rotate(2deg)}24%{transform:none}70%{box-shadow:0 0 0 12px rgba(255,79,139,0)}100%{box-shadow:0 0 0 0 rgba(255,79,139,0)}}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 90px 10px rgba(255,30,80,.55),inset 0 0 0 3px rgba(255,79,139,.5)}
body.urgent::after{animation:urgent 1s ease-in-out infinite}
@keyframes urgent{0%,100%{opacity:.25}15%{opacity:1}}

/* результат вопроса */
#res::before{content:"";position:absolute;inset:-90px -60px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side at 50% 30%,var(--tcg,transparent),transparent),radial-gradient(closest-side at 50% 50%,rgba(2,6,20,.72),rgba(2,6,20,.5) 55%,transparent)}
#res .tn{padding:0 4px;overflow-wrap:break-word}
#res .tn.t0{opacity:.9}
#res .tn.t30,#res .tn.t60{letter-spacing:3px}
#res .tn.t60{font-size:clamp(24px,6vw,46px)}
#res .tn.t85{font-size:clamp(24px,6vw,46px);animation:rise .7s cubic-bezier(.2,1.3,.4,1) both,tnGlow 1.6s .7s ease-in-out infinite}
@keyframes tnGlow{50%{filter:drop-shadow(0 0 16px var(--tc)) brightness(1.3)}}
#res .tn.t100{font-size:clamp(24px,6.2vw,50px);line-height:1.4}
#res .tn.t100 .w{display:inline-block;white-space:nowrap}
#res .tn.t100 i{font-style:normal;display:inline-block;background:linear-gradient(90deg,#ff4fd8,#ffd54a,#5ef38c,#5ff3ff,#c77dff,#ff4fd8);background-size:600% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lpop .6s calc(.2s + var(--i)*.05s) cubic-bezier(.2,1.6,.4,1) both,rbw 2.4s calc(var(--i)*-.12s) linear infinite}
@keyframes lpop{0%{opacity:0;transform:translateY(-.7em) scale(1.9) rotate(-10deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes rbw{to{background-position:120% 0}}
#res .tn.t100::before,#res .tn.t100::after{content:"";display:inline-block;width:.5em;height:.5em;vertical-align:middle;margin:-.2em .45em 0;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 1.1s ease-in-out infinite}
#res .tn.t100::after{animation-delay:-.55s}
@keyframes twinkle{50%{transform:scale(.5) rotate(45deg);opacity:.4}}
#res .ta{line-height:1.6;text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.6)}
#res .tp{display:inline-block;padding:7px 12px 6px;background:rgba(2,6,18,.6);border:1px solid var(--tcg,var(--line));text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
#res .tf{line-height:1.55;text-shadow:0 1px 0 #000,0 0 8px #000}
#res .bars{--bk:var(--tc,var(--cy));padding:14px 14px 12px;box-shadow:0 0 0 2px #000,0 0 30px var(--tcg,transparent)}
#res .bars h4{margin-bottom:10px}
.b{margin:5px 0}
.b .tr{height:22px;background:repeating-linear-gradient(90deg,#0b1a33 0 6px,#071226 6px 8px);box-shadow:inset 0 0 0 1px rgba(44,95,147,.45)}
.b .fl{background:repeating-linear-gradient(90deg,#2b6aa6 0 6px,#1d4a7a 6px 8px);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -3px 0 rgba(0,0,0,.25);transition:width 1.1s var(--ease)}
.b:nth-of-type(2) .fl{transition-delay:.08s}.b:nth-of-type(3) .fl{transition-delay:.16s}.b:nth-of-type(4) .fl{transition-delay:.24s}.b:nth-of-type(5) .fl{transition-delay:.32s}.b:nth-of-type(6) .fl{transition-delay:.4s}
.b .bl{line-height:22px;text-shadow:0 1px 0 #000}
.b.me .tr{box-shadow:inset 0 0 0 1px var(--hot),0 0 12px rgba(255,79,139,.35)}
.b.me .fl{background:repeating-linear-gradient(90deg,#ff5f97 0 6px,#d93a73 6px 8px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.2)}
.b.me .bl{color:#fff;font-weight:700}
.b.me .bl::before{content:"▶ "}
.b.me .pc{color:var(--hot);font-weight:700}
#res .resBtns .btn{min-width:min(170px,100%)}

/* итоговый экран */
#end{padding:24px 22px 20px;max-height:calc(100% - 96px)}
#end h2,#mbox h3{position:relative;line-height:1.6;padding-bottom:12px;border-bottom:2px solid rgba(44,95,147,.6)}
#end h2::after,#mbox h3::after{content:"";position:absolute;left:0;bottom:-2px;width:56px;height:2px;background:var(--cy);box-shadow:0 0 8px var(--cy)}
#end h2{font-size:10px}
#end h2 .ico,#mbox h3 .ico{margin:-3px 4px 0 0}
#end .alt{font-size:clamp(34px,9vw,58px);line-height:1.15;margin:18px 0 10px;letter-spacing:2px;font-variant-numeric:tabular-nums}
#end .lm{display:inline-block;padding:6px 10px;line-height:1.5;background:rgba(95,243,255,.08);border-left:3px solid var(--cy)}
#end .grid{padding:10px;margin:14px 0;background:rgba(0,0,0,.28);border:1px dashed var(--dash);justify-content:center}

// английский: без ё, диакритика снимается, «&» = and; кириллица в английской игре не засчитывается
const norm=EN?s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\+\+/g," plus plus").replace(/#/g," sharp").replace(/&/g," and ").replace(/[-‐–—]/g," ").replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim()
 :s=>s.toLowerCase().replace(/ё/g,"е").replace(/\+\+/g," плюс плюс").replace(/#/g," шарп").replace(/[-‐–—]/g," ").replace(/[^a-zа-я0-9 ]/g,"").replace(/\s+/g," ").trim();
// английская «основа»: лёгкое правило множественного числа (apples → apple, boxes → box, berries/berry → berri)
const stem=EN?s=>s.split(" ").map(w=>w.length>3?w.replace(/([^s])s$/,"$1").replace(/e$/,"").replace(/y$/,"i"):w).join(" ")
 :s=>s.split(" ").map(w=>w.length>4?w.replace(/(ями|ами|ого|его|ой|ей|ий|ый|ая|яя|ое|ее|ые|ие|ов|ев|ок|ек|ы|и|а|я|о|е|ь|у|ю|й)$/,""):w).join(" ");

function addAns(q,names,pct,clever,src){
  const keys=[...new Set(names.map(norm).filter(Boolean))];if(!keys.length||q.map.has(keys[0]))return null;
  const own=keys.filter(k=>!q.map.has(k));const a={label:names[0].trim(),keys:own,stems:own.map(stem),pct,clever,src};
  own.forEach(k=>q.map.set(k,a));q.a.push(a);q.ix=null;return a;
}
const Qs=(window.ORB||[]).map(([cat,qt,main,one="",zero=""],id)=>{
  if(MORE[qt])zero=zero?zero+", "+MORE[qt]:MORE[qt];
  const q={id,cat,q:qt,a:[],map:new Map(),del:new Set(),ix:null};
  main.split(",").forEach(x=>{x=x.trim();if(!x)return;const m=x.match(/^(.*?)\s+(\d+)(!?)$/);if(m)addAns(q,m[1].split("/"),+m[2],!!m[3]);else addAns(q,x.split("/"),1,false)});
  one.split(",").forEach(x=>{x=x.trim();if(x)addAns(q,x.split("/"),1,false)});
  zero.split(",").forEach(x=>{x=x.trim();if(x)addAns(q,x.split("/"),0,false)});
  return q;
});

const PCT_OF={10:15,15:0,30:6,60:2,85:1,100:0};
// ручные правки поверх списков (data/overrides.js, делается в tools/review.html): tier — очки, del — убрать и не засчитывать
function applyOv(q){
  const o=(window.ORB_OV||{})[q.q];if(!o)return;
  (o.add||[]).forEach(([p,...names])=>{if(!names.some(n=>q.map.has(norm(n))))addAns(q,names,PCT_OF[p]??0,p===15,"ov")});
  for(const[k,p]of Object.entries(o.tier||{})){const a=q.map.get(norm(k));if(a){a.pct=PCT_OF[p]??a.pct;a.clever=p===15}}
  (o.del||[]).forEach(k=>{k=norm(k);q.del.add(k);const a=q.map.get(k);if(!a)return;q.a.splice(q.a.indexOf(a),1);a.keys.forEach(x=>q.map.delete(x));q.ix=null});
}
Qs.forEach(applyOv);
// полные списки из Wikidata (data/wd/<id>.json) грузятся лениво перед вопросом.
// Совпавший с ручным ответ только добавляет ему синонимы, процент остаётся ручным.
function mergeWD(q,d){
  if(!d||d.q!==q.q||q.wd)return;q.wd=true;
  for(const[pct,...names]of d.a){
    const keys=[...new Set(names.map(norm).filter(k=>k.length>1))];if(!keys.length||keys.some(k=>q.del.has(k)))continue;
    const ex=keys.map(k=>q.map.get(k)).find(Boolean);
    if(ex){for(const k of keys)if(!q.map.has(k)){q.map.set(k,ex);ex.keys.push(k);ex.stems.push(stem(k))}}
    else{const a={label:names[0].trim(),keys,stems:keys.map(stem),pct,clever:false,src:"wd"};keys.forEach(k=>q.map.set(k,a));q.a.push(a)}
  }
  q.ix=null;applyOv(q);
}
const WD_P={};
function loadWD(id){
  const q=Qs[id];if(!q||q.wd)return Promise.resolve();

}
// ждём список, но не дольше ms — без него вопрос всё равно играбелен
function readyWD(id,ms=4000){return Promise.race([loadWD(id),new Promise(r=>setTimeout(r,ms))])}

// расстояние Дамерау–Левенштейна (перестановка соседних букв = 1 ошибка) с ранним выходом, если уже больше max
function dl(a,b,max){
  const m=a.length,n=b.length;if(Math.abs(m-n)>max)return max+1;
  let p2=null,p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];let lo=i;
    for(let j=1;j<=n;j++){let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v;if(v<lo)lo=v}
    if(lo>max)return max+1;p2=p;p=c}
  return p[n];
}
// допустимо опечаток: короткие слова — только точно
const tolOf=len=>len>=8?2:len>=5?1:0;
// индекс вопроса: ключи и основы, разложенные по длине — нечёткий поиск смотрит только соседние длины
function qIndex(q){
  if(q.ix)return q.ix;
  const byLen=new Map(),stems=new Map();
  const put=(M,k,a)=>{let l=M.get(k.length);if(!l)M.set(k.length,l=[]);l.push([k,a])};
  for(const a of q.a){a.keys.forEach(k=>put(byLen,k,a));a.stems.forEach(s=>{if(s.length>=3)put(stems,s,a)})}
  return q.ix={byLen,stems};
}
function fuzzy(M,n,tolFn,strict){
  let best=null,bd=9,bp=-1;
  for(let L=n.length-2;L<=n.length+2;L++){const arr=M.get(L);if(!arr)continue;
    for(const[k,a]of arr){const tol=tolFn(k.length);if(!tol&&k!==n)continue;if(Math.abs(L-n.length)>tol)continue;
      // большие списки из Wikidata: первая буква должна совпасть — меньше ложных попаданий
      if(strict&&a.src==="wd"&&k[0]!==n[0])continue;
      const d=k===n?0:dl(k,n,tol);if(d<=tol&&(d<bd||(d===bd&&a.pct>bp))){bd=d;best=a;bp=a.pct}}}
  return best;
}
function findAns(q,raw){
  const n=norm(raw);if(!n||q.del.has(n))return null;
  // «гта 5», «дота 2» — номер части не делает популярный ответ редким
  const base=n.replace(/(?<=[a-zа-я]) ?[0-9]+( [0-9]+)*$/,"");
  if(base!==n){const a=q.map.get(base);if(a&&a.pct>0)return a}
  const ex=q.map.get(n);if(ex)return ex;
  const ix=qIndex(q);
  const f=fuzzy(ix.byLen,n,tolOf,true);if(f)return f;
  const s=fuzzy(ix.stems,stem(n),len=>len>=5?1:0,true);if(s)return s;
  const words=n.split(" ");
  if(words.length>1)for(const a of q.a)if(a.src!=="wd")for(const k of a.keys)if(!k.includes(" ")&&k.length>=4&&words.includes(k))return a;
  return null;
}

const KB=["qwertyuiop","asdfghjkl","zxcvbnm","йцукенгшщзхъ","фывапролджэ","ячсмитьбю"];
function junkWord(w){
  if(/([a-zа-я])\1\1/.test(w))return true;
  const L=w.replace(/[^a-zа-я]/g,"");
  if(/[^aeiouyаеиоуыэюя]{5,}/.test(L))return true;
  for(const r of KB){const rr=[...r].reverse().join("");for(let i=0;i+5<=L.length;i++){const p=L.slice(i,i+5);if(r.includes(p)||rr.includes(p))return true}}
  return false;
}

const MODEL_Q=EN?/weapon|gun|rifle|tank|plane|aircraft|helicopter|rocket|\bcar\b|vehicle|tech|electronic|phone|gadget|tool|\bfly\b|train|ship|processor|graphics card/

function freeAns(q,raw){
  if(!MODEL_Q.test(q.q.toLowerCase()))return null;
  const n=norm(raw);if(n.replace(/ /g,"").length<3)return null;
  // модель: буквы (1–8) + номер (1–5 цифр), дальше максимум два коротких хвоста: «т 300 22384382», «ак 47», «ту 154», «iphone 15 pro»
  if(!/^[a-zа-я]{1,8} ?[0-9]{1,5}[a-zа-я]{0,3}( [0-9a-zа-я]{1,10}){0,2}$/.test(n))return null;
  if(n.split(" ").some(junkWord))return null;
  return mkFree(raw.trim());
}

function makeGround(cs){const[c,g]=mkCan(W,GH);const r=rng(17),by=GH,mid=W/2,clear=72*cs;

    g.fillStyle="rgba(255,213,74,.6)";if(b.win>.3)for(let yy=by-bh+4*cs;yy<by-4*cs;yy+=8*cs)for(let xx=bx+3*cs;xx<bx+bw-3*cs;xx+=6*cs)if(((xx*7+yy*13)|0)%5===0)g.fillRect(Math.round(xx),Math.round(yy),Math.max(1,2*cs|0),Math.max(1,3*cs|0));

function update(dt){
  const w=world;w.t+=dt;

  w.anchor+=(w.anchorT-w.anchor)*Math.min(1,dt*2);
  w.tierA+=(w.tierAT-w.tierA)*Math.min(1,dt*5);

    if(A.type==="launch"){
      if(A.t<A.ign){w.thrust=lerp(.2,1,A.t/A.ign);if(!calm)w.shake=Math.max(w.shake,2+3*(A.t/A.ign));
        if(w.alt<.5)for(let i=0;i<4;i++)spawnP(W/2+rand(-10,10),w.alt,rand(-170,170),rand(-10,30),rand(1,2.4),rand(8,22),1,null,0,16);}
      else{const k=clamp((A.t-A.ign)/A.dur,0,1);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;w.alt=lerp(A.from,A.to,e);w.thrust=1-Math.pow(k,4)*.6;
        if(w.boost&&k>=.42)separate();

        if(k>=1){w.anim=null;w.thrust=0;w.boost=0;A.done&&A.done()}}
    } else if(A.type==="fizz"){
      // жалкое чихание: три кашля, подскок и грустный наклон
      if(A.n<3&&A.t>=.1+A.n*.36){A.n++;cough(A.n)}
      w.thrust=Math.max(0,w.thrust-dt*5);if(A.t>1.15&&!w.droop){w.droop=2.6;w.tiltT=calm?0:.13;fx({k:"ring",col:"#8fa3bd",r1:36,lw:3,life:1.1,a:.6,at:"top"})}

      if(A.t>1.45){w.anim=null;w.thrust=0;A.done&&A.done()}}
  }

    else if(r<.55)spawnP(W/2+rand(-4,4),w.alt-rand(4,10)/w.px,rand(-90,90),-rand(40,180)*fl,rand(.3,.8),2,4,Math.random()<.5?"#ffd54a":"#ff8a2e",-60);
    else if(Math.random()<air)spawnP(W/2+rand(-7,7),w.alt-rand(6,14)/w.px,rand(-35,35),-rand(50,170)*fl,rand(.7,1.4),rand(6,12),1,null,0,14)}}
  // пар из дренажей, пока ракета стоит на площадке

  for(let i=w.drops.length-1;i>=0;i--){const d=w.drops[i];d.life-=dt;d.x+=d.vx*dt;d.va-=dt*.9;d.alt+=d.va*dt;d.rot+=d.vr*dt;if(d.life<=0)w.drops.splice(i,1);else if(Math.random()<.4)spawnP(d.x,d.alt,rand(-10,10),rand(-5,15),rand(.5,1),rand(3,6),1,null,0,8)}

  // метеоры сгорают на 70–110 км; хранятся в км, чтобы висеть на своей высоте
  if(ys(110)<H+40&&ys(70)>-40&&w.meteors.length<6&&Math.random()<dt*1.6)w.meteors.push({x:rand(W*.2,W*1.2),alt:rand(85,112),vx:rand(-420,-220),va:-rand(8,16),life:rand(.6,1.1),ml:1});

}

function storeKey(){return G.mode==="daily"?DK(dateOf(G.day)):G.mode==="duel"?"orb-du-"+G.duel.code:null}
// в лог пишем каноническое название; p — «процент» ответа, ai — засчитан проверкой ИИ
function save(done){const k=storeKey();if(!k)return;const log=G.log.map(l=>({qid:l.qid,raw:l.raw,label:l.hit?l.hit.label:null,free:l.hit&&l.hit.free?1:0,pts:l.pts,...(l.hit?{p:l.hit.pct}:{}),...(l.hit&&l.hit.ai?{ai:1}:{})}));store.set(k,{...(store.get(k)||{}),i:G.i,score:G.score,log,done});if(G.mode==="duel")duelPush(G.duel.code,G.duel.token,log.length,G.score,log,done)}

// p — процент с учётом игроков на момент ответа, поэтому очки восстанавливаются те же
function restoreLog(saved){return saved.log.map(l=>{const q=Qs[l.qid];let hit=null;
  if(l.label){const f=!l.free&&q&&q.map.get(norm(l.label));
    const base=f||{...mkFree(l.label),free:!!l.free,ai:!!l.ai};
    hit={...base,...(f?{base:f}:{}),pct:l.p!=null?l.p:base.pct};
    if(tierOf(hit).p!==l.pts)hit={...hit,pct:PCT_OF[l.pts]??0,clever:l.pts===15}}
  return{qid:l.qid,raw:l.raw,hit,pts:l.pts}})}

  stopPoll();roomStop();show("opp",false);

    if(s.log&&s.log.length){G.log=restoreLog(s);G.i=s.log.length;G.score=s.score;if(s.done||G.i>=7){enterGameView(true);world.alt=G.score;world.cam=G.score;return finish(true)}toast(tl("Продолжаем дуэль — второго шанса нет"))}

  const box=(p,sl)=>`<div class="hbox ${win===sl?"win":""}"><small>${p?esc(p.name.toUpperCase())+(sl===me?tl(" · ТЫ"):""):"???"}</small><b>${p?p.score+tl(" КМ"):"—"}</b></div>`;

  const rows=d.qs.map((qid,i)=>`<tr class="dq"><td colspan="2">${i+1}. ${esc(Qs[qid]?Qs[qid].q:"?")}</td></tr><tr>${cell(P[0],i)}${cell(P[1],i)}</tr>`).join("");
  const e=$("end");const keep=e.scrollTop;
  e.innerHTML=`<h2>${ico("duel",14)} ${tl("ДУЭЛЬ {c}",{c:esc(d.code)})}</h2><div class="dvs">${box(P[0],0)}<span>VS</span>${box(P[1],1)}</div>${head}

  e.scrollTop=keep;show("end",true);

  $("dAgain").onclick=()=>{SFX.click();duelMenu()};$("homeBtn").onclick=goHome;

    duel:P.map((p,sl)=>({name:p.name,score:p.score,win:win===sl,badges:d.qs.map((q,i)=>TIERS[(p.log[i]||{}).pts]||TIERS[0])}))},
    tl("Дуэль в «Орбите»: {a} {x} км vs {b} {y} км",{a:P[0].name,x:P[0].score,b:P[1].name,y:P[1].score}),duelLink(d.code));

// Сервер ведёт игру: выдаёт вопрос всем сразу, общий дедлайн по своим часам, проверяет и считает ответы.
// Состояние приходит целиком по SSE (/api/room/stream), токен игрока — в localStorage («orb-room»).
let R=null;const RCLK={off:0,rtt:1e9};
const srvNow=()=>Date.now()+RCLK.off;
const roomLink=c=>location.origin+location.pathname+"?room="+c;
const ROOM_NS=[5,7,10,15];
async function roomCall(fn,args){
  const t0=Date.now();let r,d=null;
  try{r=await fetch(`${API}/room/${fn}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(args)})}catch(e){const x=new Error("net");x.status=0;throw x}
  const t1=Date.now();try{d=await r.json()}catch(e){}
  if(!r.ok){const x=new Error(d&&d.error||"http");x.status=r.status;throw x}
  if(d&&d.state&&typeof d.state.now==="number"&&t1-t0<RCLK.rtt){RCLK.rtt=t1-t0;RCLK.off=d.state.now-(t0+t1)/2}
  return d;
}
const roomSaved=()=>{const s=store.get("orb-room");return s&&s.code&&s.t&&Date.now()-(s.ts||0)<2*3600e3?s:null};
const catName=c=>c&&CATS[c]?CATS[c].toUpperCase():tl("ВСЕ ТЕМЫ");
function roomSetHTML(n,cat,on){return`<label>${tl("ВОПРОСОВ")}</label><div class="seg" id="rN">${ROOM_NS.map(k=>`<button class="btn small ${k===n?"on":""}" data-n="${k}" ${on?"":"disabled"}>${k}</button>`).join("")}</div>
  <label>${tl("ТЕМА")}</label><select class="nick" id="rCat" ${on?"":"disabled"}><option value="">${tl("ВСЕ ТЕМЫ")}</option>${Object.keys(CATS).map(c=>`<option value="${c}" ${c===cat?"selected":""}>${CATS[c].toUpperCase()}</option>`).join("")}</select>`}

   ${nickField()}<div id="rSet">${roomSetHTML(n,"",true)}</div>

    catch(e){toast(e.status===429||e.status===503?tl("СЛИШКОМ МНОГО КОМНАТ — ПОДОЖДИ"):tl("НЕТ СВЯЗИ — ПОПРОБУЙ ЕЩЁ"));$("rNew").disabled=false}};
  const join=()=>{const c=$("codeIn").value.trim().toUpperCase();if(!/^[A-Z0-9]{4}$/.test(c)){toast(tl("КОД — 4 СИМВОЛА"));return}if(!readNick())return;roomOpen(c,true)};
  $("rJoin").onclick=join;$("codeIn").onkeydown=e=>{if(e.key==="Enter")join()};

const urlClear=()=>{if(/[?&]room=/.test(location.search))history.replaceState(null,"",location.pathname)};
// по коду/ссылке: свой токен есть — сразу назад в комнату, иначе — окно входа с ником
async function roomOpen(code,direct){
  code=String(code).toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
  const sv=store.get("orb-room");let d;
  try{d=await roomCall("state",{code,token:sv&&sv.code===code?sv.t:null})}
  catch(e){toast(e.status===404?tl("КОМНАТА НЕ НАЙДЕНА"):tl("НЕТ СВЯЗИ — ПОПРОБУЙ ЕЩЁ"));if(e.status===404&&sv&&sv.code===code)store.set("orb-room",null);urlClear();return}
  // комната на другом языке: переключаемся на её язык и открываем заново
  if((d.state.lang||"ru")!==LANG)return setLang(d.state.lang||"ru","room",location.pathname+"?room="+code);
  if(d.id)return roomEnter(code,sv.t,d.id,d.state,d.mine);
  const s=d.state,host=s.players.find(p=>p.id===s.host);
  const go=async()=>{const nick=readNick();if(!nick)return;SFX.click();const token=newToken();
    try{const j=await roomCall("join",{code,name:nick,token});if(j.error==="full"){toast(tl("КОМНАТА ЗАПОЛНЕНА"));return}roomEnter(code,token,j.id,j.state,null)}
    catch(e){toast(e.status===404?tl("КОМНАТА НЕ НАЙДЕНА"):tl("НЕТ СВЯЗИ — ПОПРОБУЙ ЕЩЁ"))}};
  if(direct&&$("nickIn")&&$("nickIn").value.trim())return go();
  const what=s.phase==="lobby"?tl("собирает экипаж"):s.phase==="end"?tl("игра окончена — ждём новую"):tl("идёт вопрос {n} из {m} — войдёшь со следующего",{n:s.round+1,m:s.total});
  modal(`<h3>${ico("party",14)} ${tl("ЗОВУТ В КОМНАТУ")}</h3><div class="sub" style="margin-top:0">${host?`<b>${esc(host.name)}</b> `:""}${what} · ${tl("в экипаже")} ${s.players.length}/30</div><div class="dcode">${esc(code)}</div>${nickField()}
   <div class="rowBtns" style="margin-top:12px"><button class="btn small" id="rLater">${tl("ПОТОМ")}</button><button class="btn hot" id="rAcc">${ico("rocket",12)} ${tl("ВОЙТИ")}</button></div>`);
  $("rAcc").onclick=go;$("nickIn").onkeydown=e=>{if(e.key==="Enter")go()};$("rLater").onclick=()=>{show("modal",false);urlClear()};
}
function roomEnter(code,t,id,st,mine){
  show("modal",false);stopPoll();stopClock();roomStop(true);
  store.set("orb-room",{code,t,id,ts:Date.now()});
  history.replaceState(null,"",location.pathname+"?room="+code);
  R={code,t,id,v:-1,st:null,key:"",es:null,mine:mine||null,tick:null,wasIn:-1,shownEnd:false,seen:new Set()};
  G={mode:"room",qs:[],i:0,score:0,log:[],title:tl("КОМНАТА {c}",{c:code})};
  show("home",false);hideAll();
  roomApply(st);roomListen();
}
function roomListen(){
  if(!R)return;if(R.es)R.es.close();
  const r=R;let es;try{es=new EventSource(`${API}/room/stream?code=${r.code}&p=${encodeURIComponent(r.id)}`)}catch(e){return}
  r.es=es;
  es.addEventListener("st",e=>{if(R!==r)return;let s;try{s=JSON.parse(e.data)}catch(x){return}if(RCLK.rtt>=1e9)RCLK.off=s.now-Date.now();roomApply(s)});
  // поток закрылся насовсем (комната пропала или сервер перезапущен) — уточняем состояние и переподключаемся
  es.onerror=()=>{if(R!==r||es.readyState!==2)return;setTimeout(()=>{if(R===r)roomResync(true)},3000)};
}
async function roomResync(reopen){
  const r=R;if(!r)return;
  try{const d=await roomCall("state",{code:r.code,token:r.t});if(R!==r)return;
    if(!d.id)return roomGone(tl("ТЕБЯ БОЛЬШЕ НЕТ В КОМНАТЕ"));
    if(d.mine)r.mine=d.mine;roomApply(d.state);if(reopen||!r.es||r.es.readyState===2)roomListen()}
  catch(e){if(R!==r)return;if(e.status===404)return roomGone(tl("КОМНАТА ЗАКРЫЛАСЬ"));setTimeout(()=>{if(R===r)roomResync(true)},5000)}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&R)roomResync(false)});
function roomGone(msg){toast(msg);store.set("orb-room",null);roomStop();goHome()}
function roomStop(keepUrl){
  if(!R)return;const r=R;R=null;
  if(r.es)r.es.close();clearInterval(r.tick);stopClock();
  show("opp",false);$("hScoreL").textContent=tl("СЧЁТ");
  if(!keepUrl)urlClear();
}
function roomLeave(){const r=R;if(!r)return;SFX.click();roomCall("leave",{code:r.code,token:r.t}).catch(()=>{});store.set("orb-room",null);roomStop();goHome()}
const meP=()=>R&&R.st?R.st.players.find(p=>p.id===R.id):null;
function placeOf(s,id){const me=s.players.find(p=>p.id===id);if(!me)return 0;return 1+s.players.filter(p=>p.score>me.score).length}

function roomApply(s){
  const r=R;if(!r||!s||s.code!==r.code||s.v<r.v)return;
  r.v=s.v;r.st=s;
  const me=s.players.find(p=>p.id===r.id);
  if(!me)return roomGone(tl("ТЕБЯ БОЛЬШЕ НЕТ В КОМНАТЕ"));
  const key=s.phase+":"+s.round;
  // перерисовываем панель, только если на ней что-то поменялось (иначе анимации начинаются заново)
  const sig=JSON.stringify([s.host,s.n,s.cat,s.players.map(p=>[p.id,p.name,p.score,s.phase==="lobby"?p.on:0])]);
  if(key===r.key&&sig===r.sig&&s.phase!=="q")return;r.sig=sig;
  if(key!==r.key){r.key=key;clearInterval(r.tick);
    if(s.phase==="lobby")roomLobby();else if(s.phase==="q")roomQ();else if(s.phase==="reveal")roomReveal();else roomEnd();return}

const lbPending=()=>{const s=store.get(lbKey(TODAY));return!!(s&&s.done&&!s.lb)};
async function lbPost(path,body,ms=8000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});let d=null;try{d=await r.json()}catch(e){}return{status:r.status,d}}
  catch(e){return{status:0,d:null}}finally{clearTimeout(t)}
}
// box — id блока, где спросить ник или показать ошибку; done() — после удачной отправки
async function lbSubmit(box,done,name){
  const s=store.get(lbKey(TODAY));if(!s||!s.done||s.lb)return done();
  name=(name||nickOf()).trim();if(!name)return lbAskNick(box,done,"");
  const el=$(box);if(!el)return;el.innerHTML=`<div class="next">${tl("ОТПРАВЛЯЮ В РЕЙТИНГ…")}</div>`;
  const{status,d}=await lbPost("/lb/submit",{pid:pid(),lang:LANG,day:TODAY,name,log:lbLog(s)},20000);
  if(!$(box))return;
  if(status===200&&d&&d.ok){const s2=store.get(lbKey(TODAY))||s;s2.lb={score:d.score};store.set(lbKey(TODAY),s2);if(!nickOf())store.set("orb-nick",name);return done()}
  const e=d&&d.error;
  if(e==="bad_name")return lbAskNick(box,done,tl("ЭТОТ НИК НЕ ПОДОЙДЁТ — ПРИДУМАЙ ДРУГОЙ"));
  const msg=e==="bad_set"?tl("ВОПРОСЫ ОБНОВИЛИСЬ — ОБНОВИ СТРАНИЦУ"):e==="bad_request"?tl("ЭТОТ ЗАПУСК УЖЕ НЕЛЬЗЯ ОТПРАВИТЬ"):e==="too_many"?tl("С ЭТОГО АДРЕСА СЕГОДНЯ УЖЕ МНОГО ЗАПИСЕЙ"):tl("НЕ ВЫШЛО ОТПРАВИТЬ В РЕЙТИНГ");
  const again=!e||e==="retry"||e==="busy"||e==="rate_limited";
  $(box).innerHTML=`<div class="next">${msg}</div>${again?`<div class="rowBtns"><button class="btn small" id="lbRetry">${tl("ЕЩЁ РАЗ")}</button></div>`:""}`;
  if(again)$("lbRetry").onclick=()=>{SFX.click();lbSubmit(box,done,name)};
}
function lbAskNick(box,done,msg){
  const el=$(box);if(!el)return;
  el.innerHTML=`<div class="lbhead"><b>${tl("РЕЙТИНГ ДНЯ")} · #${TODAY}</b></div><div class="next" style="margin-top:6px">${msg||tl("ПРИДУМАЙ НИК — И ТЫ В ТАБЛИЦЕ ДНЯ")}</div>
   <label>${tl("ТВОЙ НИК")}</label><input class="nick" id="lbNick" maxlength="16" placeholder="${tl("например, Гагарин")}" value="${esc(nickOf())}">
   <div class="rowBtns"><button class="btn hot" id="lbGo">${ico("star",12)} ${tl("В РЕЙТИНГ")}</button></div>`;
  const go=()=>{const v=$("lbNick").value.trim().slice(0,16);if(!v){$("lbNick").focus();toast(tl("ВВЕДИ НИК"));return}SFX.click();lbSubmit(box,done,v)};
  $("lbGo").onclick=go;$("lbNick").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};
}
// следим за таблицей, пока её видно: один таймер на блок
const LBW={};
function lbWatch(id,req,render){
  lbUnwatch(id);const w={v:null};LBW[id]=w;
  const tick=async()=>{
    if(LBW[id]!==w)return;const el=$(id);if(!el||el.closest(".hidden")){lbUnwatch(id);return}
    if(!document.hidden){const{status,d}=await lbPost("/lb",{...req,v:w.v,lang:LANG});if(LBW[id]!==w||!$(id))return;
      if(status===200&&d&&!d.same&&Array.isArray(d.top)){w.v=d.v;render(d)}else if(w.v==null&&!(status===200&&d&&d.same))render(null)}
    w.t=setTimeout(tick,8000)};
  tick();
}
function lbUnwatch(id){const w=LBW[id];if(w){clearTimeout(w.t);delete LBW[id]}}
function lbRow(r,me){
  return`<div class="lr ${me?"me":""}"><span class="pl ${r.p<=3?"g"+r.p:""}">#${r.p}</span><span class="nm ${r.name==null?"anon":""}">${r.name==null?tl("ПИЛОТ"):esc(r.name.toUpperCase())}${me?tl(" · ТЫ"):""}${r.day?` <small>#${r.day}</small>`:""}</span><span class="tb">${(r.tiers||[]).map(p=>tierBadge(TIERS[p]||TIERS[0],10)).join("")}</span><span class="sc">${r.score}${tl(" КМ")}</span></div>`;
}
// d — ответ /api/lb; o.title, o.mine (что показать, если тебя нет в таблице), o.score (свой счёт в игре), o.foot
function lbTable(d,o={}){
  if(!d)return`<div class="lbhead"><b>${o.title||tl("РЕЙТИНГ")}</b></div><div class="next">${tl("НЕТ СВЯЗИ С ЦУПОМ — ПРОБУЮ ЕЩЁ")}</div>${o.foot||""}`;
  let h=`<div class="lbhead"><b>${o.title||tl("РЕЙТИНГ ДНЯ")+" · #"+d.day}</b><small>${d.n} ${plural(d.n,"ПИЛОТ","ПИЛОТА","ПИЛОТОВ")}</small></div>`;
  if(d.me&&d.me.hidden)h+=`<div class="lbnote">${tl("твоя запись скрыта модератором")}</div>`;
  else if(d.me){h+=`<div class="lbme">${tl("ТЫ #{p} ИЗ {n}",{p:d.me.p,n:d.n})}</div>`;if(o.score!=null&&d.me.score!==o.score)h+=`<div class="lbnote">${tl("в рейтинге {s} км — очки пересчитал сервер",{s:d.me.score})}</div>`}
  else if(o.mine)h+=o.mine;
  const meIn=d.top.some(r=>r.me);
  h+=d.top.length?d.top.map(r=>lbRow(r,!!r.me)).join(""):`<div class="next">${tl("ПОКА ПУСТО — СТАНЬ ПЕРВЫМ")}</div>`;
  if(d.me&&!d.me.hidden&&!meIn)h+=`<div class="lr gap">· · ·</div>${lbRow(d.me,true)}`;
  return h+(o.foot||"");
}
// итоговый экран сегодняшнего запуска: отправить (спросив ник), потом место и топ-10
function lbEnd(g){
  if(!$("lbBox"))return;
  const view=()=>{if(G!==g)return;const foot=`<div class="rowBtns"><button class="btn small" id="lbAll">${ico("star",12)} ${tl("ВЕСЬ РЕЙТИНГ")}</button></div>`;
    lbWatch("lbBox",{kind:"day",day:TODAY,pid:pid(),lim:10},d=>{const b=$("lbBox");if(!b)return;b.innerHTML=lbTable(d,{score:g.score,foot});const a=$("lbAll");if(a)a.onclick=()=>lbScreen("day")})};
  if(lbPending())lbSubmit("lbBox",view);else view();
}
// экран «РЕЙТИНГ»: сегодня / вчера / лучшие за неделю
function lbScreen(tab){
  const TABS=[["day",tl("СЕГОДНЯ")],["yday",tl("ВЧЕРА")],["week",tl("НЕДЕЛЯ")]];
  modal(`<h3>${ico("star",14)} ${tl("РЕЙТИНГ")}</h3><div class="seg lbtabs" id="lbTabs">${TABS.map(([k,n])=>`<button class="btn small ${k===tab?"on":""}" data-t="${k}">${n}</button>`).join("")}</div>
   <div id="lbModal"><div class="next">${tl("ЗАГРУЖАЮ…")}</div></div>
   <div class="rowBtns" style="margin-top:12px"><button class="btn small" id="lbClose">${tl("ЗАКРЫТЬ")}</button></div>`);
  $("lbClose").onclick=()=>{SFX.click();show("modal",false)};
  $("lbTabs").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{SFX.click();lbScreen(b.dataset.t)});
  const s=store.get(lbKey(TODAY));
  if(tab==="day"&&lbPending())return lbSubmit("lbModal",()=>lbScreen("day"));
  let mine="";
  if(tab==="day"&&!(s&&s.done))mine=`<div class="next">${s?tl("ДОЛЕТИ СЕГОДНЯШНИЙ ЗАПУСК — И ТЫ В ТАБЛИЦЕ"):tl("СЫГРАЙ ЗАПУСК ДНЯ — И ТЫ В ТАБЛИЦЕ")}</div><div class="rowBtns"><button class="btn hot" id="lbPlay">${ico("rocket",12)} ${s?tl("ПРОДОЛЖИТЬ"):tl("ИГРАТЬ")}</button></div>`;
  const req=tab==="week"?{kind:"week",day:TODAY}:{kind:"day",day:tab==="yday"?TODAY-1:TODAY};
  const title=tab==="week"?`${tl("ЛУЧШИЕ ЗА НЕДЕЛЮ")} · #${Math.max(1,TODAY-6)}–${TODAY}`:tab==="yday"?`${tl("ВЧЕРА")} · #${TODAY-1}`:`${tl("СЕГОДНЯ")} · #${TODAY}`;
  if(tab==="yday"&&TODAY<2){$("lbModal").innerHTML=`<div class="next">${tl("ВЧЕРА ЗАПУСКОВ ЕЩЁ НЕ БЫЛО")}</div>`;return}
  lbWatch("lbModal",{...req,pid:pid(),lim:20},d=>{const b=$("lbModal");if(!b)return;b.innerHTML=lbTable(d,{title,mine});const p=$("lbPlay");if(p)p.onclick=()=>{show("modal",false);startGame("daily")}});
}

/* =================== ГЛАВНАЯ / МЕНЮ =================== */
function goHome(){
  SFX.click();stopClock();stopPoll();roomStop();show("opp",false);hideAll();G=null;show("hud",false);show("home",true);
  world.anim=null;world.thrust=0;world.alt=0;world.tierAT=0;world.tierBase=null;world.idleFlame=0;world.pxT=pxHome();world.anchorT=homeAnchor();
  initHome();
}
function initHome(){
  const s=store.get(DK(new Date()));
  $("dayTxt").textContent=tl("ЗАПУСК #{n}",{n:TODAY});
  $("startBtn").textContent=s&&s.done?tl("▲ МОЙ РЕЗУЛЬТАТ: {s} КМ ▲",{s:s.score}):s?tl("▲ ПРОДОЛЖИТЬ ЗАПУСК ▲"):tl("▲ НАЧАТЬ ЗАПУСК ▲");
  let st=0;for(let d=TODAY;d>0;d--){const v=store.get(DK(dateOf(d)));if(v&&v.done)st++;else if(d===TODAY)continue;else break}
  $("streakTxt").innerHTML=st?`${tl("СЕРИЯ: {n}",{n:st})} ${ico("fire",12)}`:"";
}
function modal(html){$("mbox").innerHTML=html;show("modal",true)}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")show("modal",false)});
function howHTML(){return`<h3>${tl("КАК ИГРАТЬ")}</h3><ul class="rules">${["7 ВОПРОСОВ В ДЕНЬ. ОДИНАКОВЫЕ ДЛЯ ВСЕХ.","25 СЕКУНД, ЧТОБЫ НАЗВАТЬ ЧТО-ТО ОДНО.","РЕДКИЕ ОТВЕТЫ — МНОГО ОЧКОВ. ОЧЕВИДНЫЕ НИКУДА НЕ ЛЕТЯТ.","ХИТРЫЙ ОТВЕТ? ЭСКАДРИЛЬЯ ТОЖЕ О НЁМ ПОДУМАЛА.","КАЖДОЕ ОЧКО — +1 КМ ВЫСОТЫ. 700 — ОРБИТА.","ОДИН ЗАПУСК В ДЕНЬ. БЕЗ ВТОРОГО ШАНСА."].map(x=>`<li>${tl(x)}</li>`).join("")}</ul>
 <div class="tierList">${[100,85,60,30,15,10].map(p=>`<div><span style="color:${TIERS[p].c}">${tierBadge(TIERS[p],14)} ${TIERS[p].n}</span><span style="color:${TIERS[p].c}">+${p}</span></div>`).join("")}</div>
 <div class="rowBtns" style="margin-top:14px"><button class="btn" onclick="show('modal',false)">${tl("ПОНЯТНО")}</button></div>`}
$("howLink").onclick=()=>{SFX.click();modal(howHTML())};
$("startBtn").onclick=()=>startGame("daily");
$("endlessBtn").onclick=()=>startGame("endless");
$("duelBtn").onclick=()=>{SFX.click();duelMenu()};
$("roomBtn").onclick=()=>{SFX.click();roomMenu()};
$("lbBtn").onclick=()=>{SFX.click();lbScreen("day")};
$("archBtn").onclick=()=>{SFX.click();archive()};
$("packBtn").onclick=()=>{SFX.click();packs()};
function archive(){let h="";for(let d=TODAY;d>=1;d--){const v=store.get(DK(dateOf(d)));const dt=dateOf(d).toLocaleDateString(LOC,{day:"numeric",month:"short"});h+=`<button class="btn small" data-day="${d}"><span>#${d} · ${dt}${d===TODAY?tl(" · СЕГОДНЯ"):""}</span><small>${v&&v.done?v.score+tl(" км"):v?tl("не закончен"):tl("не сыгран")}</small></button>`}
 modal(`<h3>${tl("АРХИВ ЗАПУСКОВ")}</h3><div class="mlist">${h}</div><div class="rowBtns" style="margin-top:12px"><button class="btn small" onclick="show('modal',false)">${tl("ЗАКРЫТЬ")}</button></div>`);
 $("mbox").querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{show("modal",false);startGame("daily",{day:+b.dataset.day})})}
function packs(){const ic=CAT_ICON;
 modal(`<h3>${tl("ТЕМАТИЧЕСКИЕ НАБОРЫ")}</h3><div class="mlist">${Object.keys(CATS).map(c=>`<button class="btn small" data-cat="${c}"><span>${ic[c]} ${CATS[c].toUpperCase()}</span><small>${Qs.filter(q=>q.cat===c).length}${tl(" вопросов")}</small></button>`).join("")}</div><div class="rowBtns" style="margin-top:12px"><button class="btn small" onclick="show('modal',false)">${tl("ЗАКРЫТЬ")}</button></div>`);
 $("mbox").querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{show("modal",false);startGame("pack",{cat:b.dataset.cat});G.cat=b.dataset.cat})}
$("menuBtn").onclick=()=>{SFX.click();modal(`<h3>${tl("МЕНЮ")}</h3><div class="mlist">
 <button class="btn small" id="mHow"><span>${ico("help",16)} ${tl("КАК ИГРАТЬ")}</span></button>
 <button class="btn small" id="mDaily"><span>${ico("rocket",16)} ${tl("ЗАПУСК ДНЯ")}</span><small>#${TODAY}</small></button>
 <button class="btn small" id="mLb"><span>${ico("star",16)} ${tl("РЕЙТИНГ ДНЯ")}</span></button>
 <button class="btn small" id="mArch"><span>${ico("clock",16)} ${tl("АРХИВ")}</span></button>
 <button class="btn small" id="mPack"><span>${ico("grid",16)} ${tl("ТЕМАТИЧЕСКИЕ НАБОРЫ")}</span></button>
 <button class="btn small" id="mEnd"><span>${ico("inf",16)} ${tl("БЕСКОНЕЧНЫЙ РЕЖИМ")}</span></button>
 <button class="btn small" id="mDuel"><span>${ico("duel",16)} ${tl("ДУЭЛЬ С ДРУГОМ")}</span></button>
 <button class="btn small" id="mRoom"><span>${ico("party",16)} ${tl("КОМНАТА ДЛЯ КОМПАНИИ")}</span><small>${tl("до 30")}</small></button>
 <button class="btn small" id="mHome"><span>${ico("home",16)} ${tl("НА ГЛАВНУЮ")}</span></button></div>${langRow()}`);
 bindLang($("mbox"));
 $("mHow").onclick=()=>modal(howHTML());$("mDaily").onclick=()=>{show("modal",false);startGame("daily")};$("mArch").onclick=archive;$("mPack").onclick=packs;$("mEnd").onclick=()=>{show("modal",false);startGame("endless")};$("mDuel").onclick=duelMenu;$("mRoom").onclick=roomMenu;$("mLb").onclick=()=>lbScreen("day");$("mHome").onclick=()=>{show("modal",false);goHome()}};
$("sndBtn").onclick=()=>{muted=!muted;store.set("orb-mute",muted);setMuteUI();if(!muted){ac();SFX.click()}};
addEventListener("keydown",e=>{if(e.key==="Escape")show("modal",false);if(e.key==="Enter"&&!$("res").classList.contains("hidden")&&!$("res").contains(document.activeElement)){e.preventDefault();next()}});

setMuteUI();initIcons();initText();world.px=world.pxT=pxHome();initHome();world.anchor=world.anchorT=homeAnchor();
{const dc=new URLSearchParams(location.search).get("duel");if(dc){history.replaceState(null,"",location.pathname);duelOpen(dc)}
 const rc=new URLSearchParams(location.search).get("room");if(rc)roomOpen(rc)}
addEventListener("resize",()=>{world.pxT=G?pxGame():pxHome();if(!G)world.anchorT=homeAnchor()});
</script>
