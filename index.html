<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>
// сайт переехал на свой сервер: со старого адреса переносим игрока вместе с сохранениями
(function(){var S="https://orbita.129-151-216-221.sslip.io/";try{
if(/\.github\.io$/.test(location.hostname)){var m={},n=0;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^orb/.test(k)){m[k]=localStorage.getItem(k);n++}}
var h=n?encodeURIComponent(JSON.stringify(m)):"";location.replace(S+location.search+(h&&h.length<400000?"#mig="+h:""));return}
if(location.hash.indexOf("#mig=")===0){var d=JSON.parse(decodeURIComponent(location.hash.slice(5)));for(var k2 in d)if(/^orb/.test(k2)&&localStorage.getItem(k2)==null)localStorage.setItem(k2,String(d[k2]));history.replaceState(null,"",location.pathname+location.search)}
}catch(e){if(/\.github\.io$/.test(location.hostname))location.replace(S+location.search)}})();

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Орбита · ежедневный запуск</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eaf6ff;--muted:#8fb3d1;--panel:rgba(6,14,34,.82);--line:#2c5f93;--hot:#ff4f8b;--cy:#5ff3ff;--gold:#ffd54a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#02030a}
body{color:var(--ink);font-family:"JetBrains Mono",monospace;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;image-rendering:pixelated}
.px{font-family:"Press Start 2P",monospace}
.layer{position:fixed;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
.hidden{display:none!important}
#scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}

/* кнопки */
.btn{font-family:"Press Start 2P";font-size:12px;letter-spacing:1px;color:var(--ink);background:var(--panel);border:2px solid var(--cy);padding:14px 16px;cursor:pointer;box-shadow:0 0 0 2px #000,0 0 18px rgba(95,243,255,.25),inset 0 0 18px rgba(95,243,255,.12);transition:transform .08s,box-shadow .2s,background .2s;position:relative}
.btn:hover{background:rgba(20,50,90,.9);box-shadow:0 0 0 2px #000,0 0 28px rgba(95,243,255,.5),inset 0 0 24px rgba(95,243,255,.2)}
.btn:active{transform:translateY(2px)}
.btn.small{font-size:9px;padding:10px 12px;border-color:var(--line);box-shadow:0 0 0 2px #000}
.btn.hot{border-color:var(--hot);box-shadow:0 0 0 2px #000,0 0 22px rgba(255,79,139,.35),inset 0 0 18px rgba(255,79,139,.15)}
.btn.big{font-size:clamp(13px,2.6vw,18px);padding:20px 22px;width:100%}
.btn.big::after{content:"";position:absolute;inset:-6px;border:2px solid var(--cy);opacity:0;animation:pulse 2s infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.08,1.4)}}

/* верхние кнопки */
#topBtns{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:20}
#topBtns .btn{pointer-events:auto;width:40px;height:40px;padding:0;font-size:14px}

/* главная */
#home{display:flex;flex-direction:column;align-items:center;padding:clamp(40px,8vh,90px) 16px 20px}
.title{font-family:"Press Start 2P";font-size:clamp(38px,10vw,96px);letter-spacing:6px;color:#fff;position:relative;text-shadow:3px 0 var(--hot),-3px 0 var(--cy),0 0 30px rgba(255,255,255,.35);animation:glitch 4s infinite steps(1)}
@keyframes glitch{0%,92%,100%{text-shadow:3px 0 var(--hot),-3px 0 var(--cy),0 0 30px rgba(255,255,255,.35);transform:none}
93%{text-shadow:-6px 0 var(--hot),6px 0 var(--cy);transform:translateX(3px) skewX(-6deg)}
95%{text-shadow:8px 2px var(--hot),-8px -2px var(--cy);transform:translateX(-4px)}
97%{text-shadow:2px 0 var(--hot),-2px 0 var(--cy);transform:skewX(4deg)}}
.tag{font-family:"Press Start 2P";font-size:clamp(10px,2vw,14px);color:var(--cy);letter-spacing:6px;margin-top:14px;text-shadow:0 0 10px var(--cy)}
.sub{font-size:13px;color:#fff;margin-top:14px;text-shadow:0 1px 0 #000,0 0 6px #000,0 0 12px rgba(0,0,0,.6);text-align:center}
#homeBottom{position:absolute;left:50%;bottom:clamp(16px,4vh,40px);transform:translateX(-50%);width:min(560px,calc(100% - 32px))}
.rowBtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rowBtns .btn{flex:1}
.meta{display:flex;justify-content:space-between;font-family:"Press Start 2P";font-size:8px;color:#bcd8ef;margin-top:10px;text-shadow:0 1px 0 #000}
#howLink{font-family:"Press Start 2P";font-size:9px;color:#dff3ff;background:none;border:none;cursor:pointer;margin-bottom:10px;text-shadow:0 1px 0 #000;letter-spacing:1px}
#howLink:hover{color:var(--cy)}

/* HUD */
#hud{position:fixed;top:12px;left:62px;right:62px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
.hbox{background:var(--panel);border:2px solid var(--line);padding:8px 12px;min-width:120px;box-shadow:0 0 0 2px #000;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hbox small{display:block;font-family:"Press Start 2P";font-size:7px;color:var(--muted);letter-spacing:2px}
.hbox b{font-family:"Press Start 2P";font-size:clamp(13px,2.4vw,20px);color:var(--cy);display:block;margin-top:6px;text-shadow:0 0 10px rgba(95,243,255,.6)}
#hScore b{color:var(--hot);text-shadow:0 0 10px rgba(255,79,139,.6)}
#hScore{text-align:right}
#pips{display:flex;flex-direction:column;align-items:center;gap:6px}
#pips .row{display:flex;gap:4px}
#pips i{width:14px;height:14px;border:2px solid var(--line);background:#071225;display:block;transition:all .3s}
#pips i.cur{border-color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{background:#244a77}}
#pips span{font-family:"Press Start 2P";font-size:7px;color:var(--muted);letter-spacing:1px}

/* карточка вопроса */
#pcard{position:fixed;left:50%;top:22%;transform:translate(-50%,0);width:min(620px,calc(100% - 32px));background:var(--panel);border:2px solid var(--line);padding:18px 22px;box-shadow:0 0 0 2px #000,0 10px 40px rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:5}
#pcard .qn{font-family:"Press Start 2P";font-size:8px;color:var(--hot);letter-spacing:2px}
#pcard .qt{font-family:"Press Start 2P";font-size:clamp(14px,3.2vw,22px);line-height:1.55;margin:14px 0 12px;color:#fff}
#pcard .qh{font-size:11px;color:var(--muted);letter-spacing:1px}
.in{animation:cardIn .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,40px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.out{animation:cardOut .35s ease-in both}
@keyframes cardOut{to{opacity:0;transform:translate(-50%,-60px) scale(.95)}}
.typed{border-right:2px solid var(--cy);animation:caret .7s infinite}
@keyframes caret{50%{border-color:transparent}}

/* ввод */
#bar{position:fixed;left:50%;bottom:clamp(14px,4vh,36px);transform:translateX(-50%);width:min(620px,calc(100% - 32px));display:flex;gap:10px;align-items:center;z-index:6}
#ring{width:58px;height:58px;flex:none;position:relative}
#ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:5}
#ring .bg{stroke:#0b1e3a}
#ring .fg{stroke:var(--cy);stroke-linecap:butt;transition:stroke .3s;filter:drop-shadow(0 0 4px currentColor)}
#ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:"Press Start 2P";font-size:14px;color:var(--cy)}
#ring.low .fg{stroke:var(--hot)}#ring.low span{color:var(--hot);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.25)}}
#ans{flex:1;min-width:0;height:58px;font:700 18px "JetBrains Mono";background:var(--panel);color:#fff;border:2px solid var(--line);padding:0 14px;outline:none;box-shadow:0 0 0 2px #000}
#ans:focus{border-color:var(--cy);box-shadow:0 0 0 2px #000,0 0 20px rgba(95,243,255,.3)}
#ans.bad{animation:shake .4s;border-color:var(--hot)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#go{height:58px}
#err{position:fixed;left:50%;bottom:calc(clamp(14px,4vh,36px) + 70px);transform:translateX(-50%);font-family:"Press Start 2P";font-size:9px;color:var(--hot);text-shadow:0 0 8px var(--hot),0 1px 0 #000;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:6}
#err.on{opacity:1}
#err.chk{color:var(--cy);text-shadow:0 0 8px var(--cy),0 1px 0 #000;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
#res .fix{font-size:12px;color:var(--cy);margin-top:8px}
#count{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Press Start 2P";font-size:clamp(40px,10vw,90px);color:#fff;text-shadow:4px 0 var(--hot),-4px 0 var(--cy);pointer-events:none;z-index:7}
.pop{animation:pop .9s ease-out both}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}

/* результат вопроса */
#res{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));text-align:center;z-index:8}
#res .tn{font-family:"Press Start 2P";font-size:clamp(22px,5.5vw,42px);letter-spacing:2px;line-height:1.3}
#res .ta{font-family:"Press Start 2P";font-size:12px;margin-top:16px;color:#fff}
#res .tp{font-family:"Press Start 2P";font-size:11px;margin-top:14px;color:var(--cy)}
#res .tf{font-size:13px;color:#cfe3f5;margin-top:10px;font-style:italic}
#res .bars{margin:18px auto 0;max-width:420px;text-align:left;background:var(--panel);border:2px solid var(--line);padding:12px;box-shadow:0 0 0 2px #000}
#res .bars h4{font-family:"Press Start 2P";font-size:7px;color:var(--muted);letter-spacing:2px;margin-bottom:8px}
.b{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.b .tr{position:relative;height:20px;background:#081428;overflow:hidden}
.b .fl{position:absolute;inset:0 auto 0 0;width:0;background:#1d4a7a;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.b.me .fl{background:linear-gradient(90deg,var(--hot),#ff9ac0)}
.b .bl{position:relative;padding:0 8px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b .pc{text-align:right;color:var(--muted);font-size:11px}
#res .btn{margin-top:18px;min-width:220px}
.rise{animation:rise .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
.rainbow{background:linear-gradient(90deg,#ff4fd8,#ffd54a,#5ef38c,#5ff3ff,#c77dff,#ff4fd8);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:rb 2s linear infinite;filter:drop-shadow(0 0 12px rgba(255,79,216,.6))}
@keyframes rb{to{background-position:300% 0}}

/* итог */
#end{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border:2px solid var(--cy);padding:22px;box-shadow:0 0 0 2px #000,0 0 50px rgba(95,243,255,.25);z-index:8;scrollbar-width:thin}
#end h2{font-family:"Press Start 2P";font-size:11px;color:var(--hot);letter-spacing:2px}
#end .alt{font-family:"Press Start 2P";font-size:clamp(30px,8vw,52px);color:#fff;margin:14px 0 6px;text-shadow:3px 0 var(--hot),-3px 0 var(--cy)}
#end .lm{font-size:12px;color:var(--cy)}
#end .dsum{font-size:12px;color:var(--gold);margin-top:10px;line-height:1.6;animation:rise .6s cubic-bezier(.2,1.3,.4,1) both}
#end .grid{font-size:22px;letter-spacing:4px;margin:12px 0}
#end table{width:100%;border-collapse:collapse;margin-top:6px}
#end td{padding:7px 4px;border-bottom:1px dashed #1f4670;font-size:12px;vertical-align:top}
#end td.p{text-align:right;font-family:"Press Start 2P";font-size:10px;white-space:nowrap}
#end td small{color:var(--muted)}
#end .next{font-family:"Press Start 2P";font-size:8px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.8}

/* модалка */
#modal{position:fixed;inset:0;background:rgba(0,3,12,.72);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;padding:16px}
#mbox{width:min(520px,100%);max-height:calc(100vh - 40px);overflow:auto;background:#06102a;border:2px solid var(--cy);padding:20px;box-shadow:0 0 0 2px #000,0 0 50px rgba(95,243,255,.25);animation:rise .4s cubic-bezier(.2,1.3,.4,1)}
#mbox h3{font-family:"Press Start 2P";font-size:12px;color:var(--cy);margin-bottom:14px;letter-spacing:2px}
#mbox .rules li{list-style:none;font-family:"Press Start 2P";font-size:9px;line-height:1.7;color:#dcefff;padding:6px 0}
#mbox .rules li::before{content:"▲ ";color:var(--hot)}
.cardPrev{display:grid;place-items:center;min-height:160px;margin-bottom:12px}.cardPrev img{display:block;max-width:100%;max-height:min(50vh,540px);border:2px solid var(--line);box-shadow:0 0 0 2px #000}
.shBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shBtns .btn{padding:12px 8px;font-size:10px}.shBtns .btn.small{font-size:9px}.shBtns .btn[hidden]{display:none}.shBtns #shSend{grid-column:1/-1}.shBtns .btn:disabled{opacity:.5;cursor:default}
.tierList{margin-top:12px;display:grid;gap:5px}
.tierList div{display:flex;justify-content:space-between;font-family:"Press Start 2P";font-size:8px;padding:6px 8px;background:#0a1836}
.mlist{display:grid;gap:8px}
.mlist .btn{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}
.mlist .btn small{font-family:"JetBrains Mono";font-size:11px;color:var(--muted);letter-spacing:0}
.ico{display:inline-block;vertical-align:middle;image-rendering:pixelated;flex:none;filter:drop-shadow(0 0 3px rgba(95,243,255,.25))}
.btn .ico{margin:-3px 6px 0 0}
#topBtns .btn{display:grid;place-items:center}
#topBtns .btn .ico{margin:0}
.mlist .btn span{display:flex;align-items:center;gap:10px}
.mlist .btn span .ico{margin:0}
.tbadge{display:inline-grid;place-items:center;border:2px solid;vertical-align:middle;clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px)}
.tbadge .ico{filter:none}
.tb100{animation:tbglow 1.2s infinite alternate}
@keyframes tbglow{to{box-shadow:0 0 18px #ff4fd8,0 0 4px #ffd54a}}
#end .grid{display:flex;gap:8px;justify-content:flex-start;letter-spacing:0;flex-wrap:wrap}
#res .resBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#res .resBtns .btn{min-width:170px}
#end .grid>span{animation:rise .5s cubic-bezier(.2,1.4,.4,1) both}
#end td.b0{width:22px;padding-right:2px}
.tierList span{display:flex;align-items:center;gap:8px}
#streakTxt .ico{margin-top:-3px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);font-family:"Press Start 2P";font-size:9px;background:var(--hot);color:#fff;padding:10px 14px;box-shadow:0 0 0 2px #000;opacity:0;transition:.3s;z-index:40;pointer-events:none}
#toast.on{opacity:1}
body.shake canvas,body.shake #res{animation:bshake .5s}
body.shake2 canvas,body.shake2 #res{animation:bshake2 .9s}
@keyframes bshake{10%,50%,90%{transform:translate(-4px,2px)}30%,70%{transform:translate(4px,-2px)}}
@keyframes bshake2{10%,40%,70%{transform:translate(-10px,5px) rotate(-.5deg)}25%,55%,85%{transform:translate(10px,-5px) rotate(.5deg)}}
/* дуэль */
#opp{position:fixed;top:84px;right:12px;z-index:10;pointer-events:none;text-align:right}
#opp b{font-size:clamp(10px,1.8vw,13px);color:var(--gold);text-shadow:0 0 10px rgba(255,213,74,.5)}
.nick{width:100%;height:46px;font:700 16px "JetBrains Mono";background:var(--panel);color:#fff;border:2px solid var(--line);padding:0 12px;outline:none;box-shadow:0 0 0 2px #000;text-transform:none}
.nick:focus{border-color:var(--cy)}
#mbox label,#end label{display:block;font-family:"Press Start 2P";font-size:8px;color:var(--muted);letter-spacing:2px;margin:12px 0 8px}
.dcode{font-family:"Press Start 2P";font-size:clamp(26px,7vw,40px);letter-spacing:8px;color:#fff;text-align:center;margin:10px 0;text-shadow:3px 0 var(--hot),-3px 0 var(--cy)}
.dlink{font-size:11px;color:var(--cy);word-break:break-all;text-align:center;background:#0a1836;padding:8px}
.dvs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:14px 0 4px}
.dvs .hbox{min-width:0;text-align:center}
.dvs .hbox.win{border-color:var(--gold);box-shadow:0 0 0 2px #000,0 0 18px rgba(255,213,74,.45)}
.dvs .hbox b{font-size:clamp(14px,3.6vw,22px)}
.dvs .hbox small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dvs>span{font-family:"Press Start 2P";font-size:12px;color:var(--hot)}
.dwin{font-family:"Press Start 2P";font-size:clamp(16px,4.4vw,26px);text-align:center;margin-top:12px;line-height:1.4}
#end table.dt td{width:50%}
#end table.dt tr.dq td{border-bottom:none;padding-bottom:0;color:#dcefff;font-size:11px}
#end table.dt td .dp{float:right;font-family:"Press Start 2P";font-size:9px;margin-left:6px}
/* комната */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn{flex:1;min-width:48px;padding:10px 6px}
.seg .btn.on{border-color:var(--hot);color:#fff;background:rgba(255,79,139,.22);box-shadow:0 0 0 2px #000,0 0 14px rgba(255,79,139,.45)}
.seg .btn:disabled{cursor:default}
select.nick{appearance:none;-webkit-appearance:none;cursor:pointer;font-size:14px;background-image:linear-gradient(45deg,transparent 50%,var(--cy) 50%),linear-gradient(135deg,var(--cy) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select.nick option{background:#06102a;color:#fff}
.rlab{display:block;font-family:"Press Start 2P";font-size:8px;color:var(--muted);letter-spacing:2px;margin:16px 0 8px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.plist span{font-family:"Press Start 2P";font-size:9px;padding:8px 10px;background:#0a1836;border:2px solid var(--line);box-shadow:0 0 0 2px #000;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist span.nw{animation:rise .4s cubic-bezier(.2,1.3,.4,1) both}
.plist span.me{border-color:var(--cy);color:var(--cy)}
.plist span.off{opacity:.4}
.plist span .ico{margin:-3px 6px 0 0}
.rset{font-family:"Press Start 2P";font-size:9px;color:#dcefff;line-height:1.8;text-align:center;margin-top:6px}
.rbig{font-family:"Press Start 2P";font-size:clamp(18px,5vw,30px);text-align:center;margin:14px 0 6px;line-height:1.3}
.rq{font-family:"Press Start 2P";font-size:clamp(10px,2.4vw,13px);color:#fff;line-height:1.6;margin-top:10px}
.rme{text-align:center;font-size:12px;color:#dcefff}
.rme b{font-family:"Press Start 2P";font-size:11px}
.rrow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px dashed #1f4670;font-size:12px;animation:rise .5s cubic-bezier(.2,1.3,.4,1) both}
.rrow .nm{font-family:"Press Start 2P";font-size:8px;color:var(--muted);display:block;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.me .nm{color:var(--cy)}
.rrow .an{word-break:break-word}
.rrow .an small{color:var(--muted)}
.rrow .pt{font-family:"Press Start 2P";font-size:10px;white-space:nowrap;text-align:right}
.uq{display:inline-block;font-family:"Press Start 2P";font-size:7px;color:#2a0f3a;background:var(--gold);padding:3px 5px;margin-left:6px;vertical-align:1px;animation:tbglow 1.2s infinite alternate;white-space:nowrap}

 eda:{c:{o:"#ff3d6e",g:"#5ef38c",w:"#ffd0dc"},m:["....gg....","...gg.....",".oooooooo.","oooooooooo","owoooooooo","owoooooooo","oooooooooo",".oooooooo.","..ooo.ooo.",".........."]},

};
function ico(name,size=16,extra=""){const I=ICONS[name];if(!I)return"";const h=I.m.length,w=Math.max(...I.m.map(r=>r.length));let r="";I.m.forEach((row,y)=>{for(let x=0;x<row.length;x++){const col=I.c[row[x]];if(col)r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${col}"/>`}});return`<svg class="ico ${extra}" width="${size}" height="${Math.round(size*h/w)}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
const CAT_ICON=Object.fromEntries(Object.keys(CATS).map(k=>[k,ico(k,18)]));
function tierBadge(T,size=26){const inner=T.p===100?ico("star",size-8):"";return`<span class="tbadge ${T.p===100?"tb100":""}" style="width:${size}px;height:${size}px;background:${T.p===100?"#2a0f3a":T.c};border-color:${T.c};box-shadow:0 0 10px ${T.c}88" title="${T.n} +${T.p}">${inner}</span>`}
const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/\+\+/g," плюс плюс").replace(/#/g," шарп").replace(/[-‐–—]/g," ").replace(/[^a-zа-я0-9 ]/g,"").replace(/\s+/g," ").trim();
const stem=s=>s.split(" ").map(w=>w.length>4?w.replace(/(ями|ами|ого|его|ой|ей|ий|ый|ая|яя|ое|ее|ые|ие|ов|ев|ок|ек|ы|и|а|я|о|е|ь|у|ю|й)$/,""):w).join(" ");
// data/m*.js — дополнительные настоящие ответы (0%, «один на миллион»), ключ = текст вопроса
const MORE=window.ORB_MORE||{};
// q.map: нормализованный ключ → ответ. Ручные списки: повтор первого ключа пропускаем, лишние ключи не дублируем
function addAns(q,names,pct,clever,src){
  const keys=[...new Set(names.map(norm).filter(Boolean))];if(!keys.length||q.map.has(keys[0]))return null;
  const own=keys.filter(k=>!q.map.has(k));const a={label:names[0].trim(),keys:own,stems:own.map(stem),pct,clever,src};
  own.forEach(k=>q.map.set(k,a));q.a.push(a);q.ix=null;return a;
}
const Qs=(window.ORB||[]).map(([cat,qt,main,one="",zero=""],id)=>{
  if(MORE[qt])zero=zero?zero+", "+MORE[qt]:MORE[qt];
  const q={id,cat,q:qt,a:[],map:new Map(),del:new Set(),ix:null};
  main.split(",").forEach(x=>{x=x.trim();if(!x)return;const m=x.match(/^(.*?)\s+(\d+)(!?)$/);if(m)addAns(q,m[1].split("/"),+m[2],!!m[3]);else addAns(q,x.split("/"),1,false)});
  one.split(",").forEach(x=>{x=x.trim();if(x)addAns(q,x.split("/"),1,false)});
  zero.split(",").forEach(x=>{x=x.trim();if(x)addAns(q,x.split("/"),0,false)});
  return q;
});
// очки уровня → «процент» (обратная к tierOf)
const PCT_OF={10:15,15:0,30:6,60:2,85:1,100:0};
// ручные правки поверх списков (data/overrides.js, делается в tools/review.html): tier — очки, del — убрать и не засчитывать
function applyOv(q){
  const o=(window.ORB_OV||{})[q.q];if(!o)return;
  (o.add||[]).forEach(([p,...names])=>{if(!names.some(n=>q.map.has(norm(n))))addAns(q,names,PCT_OF[p]??0,p===15,"ov")});
  for(const[k,p]of Object.entries(o.tier||{})){const a=q.map.get(norm(k));if(a){a.pct=PCT_OF[p]??a.pct;a.clever=p===15}}
  (o.del||[]).forEach(k=>{k=norm(k);q.del.add(k);const a=q.map.get(k);if(!a)return;q.a.splice(q.a.indexOf(a),1);a.keys.forEach(x=>q.map.delete(x));q.ix=null});
}
Qs.forEach(applyOv);
// полные списки из Wikidata (data/wd/<id>.json) грузятся лениво перед вопросом.
// Совпавший с ручным ответ только добавляет ему синонимы, процент остаётся ручным.
function mergeWD(q,d){
  if(!d||d.q!==q.q||q.wd)return;q.wd=true;
  for(const[pct,...names]of d.a){
    const keys=[...new Set(names.map(norm).filter(k=>k.length>1))];if(!keys.length||keys.some(k=>q.del.has(k)))continue;
    const ex=keys.map(k=>q.map.get(k)).find(Boolean);
    if(ex){for(const k of keys)if(!q.map.has(k)){q.map.set(k,ex);ex.keys.push(k);ex.stems.push(stem(k))}}
    else{const a={label:names[0].trim(),keys,stems:keys.map(stem),pct,clever:false,src:"wd"};keys.forEach(k=>q.map.set(k,a));q.a.push(a)}
  }
  q.ix=null;applyOv(q);
}
const WD_P={};
function loadWD(id){
  const q=Qs[id];if(!q||q.wd)return Promise.resolve();
  const v=(window.ORB_WD||{})[id];if(!v)return Promise.resolve();
  return WD_P[id]||(WD_P[id]=fetch(`data/wd/${id}.json?v=${v}`).then(r=>r.ok?r.json():null).then(d=>mergeWD(q,d)).catch(()=>{delete WD_P[id]}));
}
// ждём список, но не дольше ms — без него вопрос всё равно играбелен
function readyWD(id,ms=4000){return Promise.race([loadWD(id),new Promise(r=>setTimeout(r,ms))])}

const TIERS={

};
const TIER_STEPS=[10,15,30,60,85,100];
function tierOf(a){if(!a)return TIERS[0];if(a.clever)return TIERS[15];if(a.pct>=15)return TIERS[10];if(a.pct>=6)return TIERS[30];if(a.pct>=2)return TIERS[60];if(a.pct>=1)return TIERS[85];return TIERS[100]}

// расстояние Дамерау–Левенштейна (перестановка соседних букв = 1 ошибка) с ранним выходом, если уже больше max
function dl(a,b,max){
  const m=a.length,n=b.length;if(Math.abs(m-n)>max)return max+1;
  let p2=null,p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const c=[i];let lo=i;
    for(let j=1;j<=n;j++){let v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));
      if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);c[j]=v;if(v<lo)lo=v}
    if(lo>max)return max+1;p2=p;p=c}
  return p[n];
}

// индекс вопроса: ключи и основы, разложенные по длине — нечёткий поиск смотрит только соседние длины
function qIndex(q){
  if(q.ix)return q.ix;
  const byLen=new Map(),stems=new Map();
  const put=(M,k,a)=>{let l=M.get(k.length);if(!l)M.set(k.length,l=[]);l.push([k,a])};
  for(const a of q.a){a.keys.forEach(k=>put(byLen,k,a));a.stems.forEach(s=>{if(s.length>=3)put(stems,s,a)})}
  return q.ix={byLen,stems};
}
function fuzzy(M,n,tolFn,strict){
  let best=null,bd=9,bp=-1;
  for(let L=n.length-2;L<=n.length+2;L++){const arr=M.get(L);if(!arr)continue;
    for(const[k,a]of arr){const tol=tolFn(k.length);if(!tol&&k!==n)continue;if(Math.abs(L-n.length)>tol)continue;
      // большие списки из Wikidata: первая буква должна совпасть — меньше ложных попаданий
      if(strict&&a.src==="wd"&&k[0]!==n[0])continue;
      const d=k===n?0:dl(k,n,tol);if(d<=tol&&(d<bd||(d===bd&&a.pct>bp))){bd=d;best=a;bp=a.pct}}}
  return best;
}
function findAns(q,raw){
  const n=norm(raw);if(!n||q.del.has(n))return null;
  // «гта 5», «дота 2» — номер части не делает популярный ответ редким
  const base=n.replace(/(?<=[a-zа-я]) ?[0-9]+( [0-9]+)*$/,"");
  if(base!==n){const a=q.map.get(base);if(a&&a.pct>0)return a}
  const ex=q.map.get(n);if(ex)return ex;
  const ix=qIndex(q);
  const f=fuzzy(ix.byLen,n,tolOf,true);if(f)return f;
  const s=fuzzy(ix.stems,stem(n),len=>len>=5?1:0,true);if(s)return s;
  const words=n.split(" ");
  if(words.length>1)for(const a of q.a)if(a.src!=="wd")for(const k of a.keys)if(!k.includes(" ")&&k.length>=4&&words.includes(k))return a;
  return null;
}

const KB=["qwertyuiop","asdfghjkl","zxcvbnm","йцукенгшщзхъ","фывапролджэ","ячсмитьбю"];
function junkWord(w){
  if(/([a-zа-я])\1\1/.test(w))return true;
  const L=w.replace(/[^a-zа-я]/g,"");
  if(/[^aeiouyаеиоуыэюя]{5,}/.test(L))return true;
  for(const r of KB){const rr=[...r].reverse().join("");for(let i=0;i+5<=L.length;i++){const p=L.slice(i,i+5);if(r.includes(p)||rr.includes(p))return true}}
  return false;
}
// модели бывают только у техники: оружие, транспорт, гаджеты, инструменты — на «мультик» или «имя» не засчитываем
const MODEL_Q=/оружи|автомат|пистолет|винтовк|танк|самол|вертол|ракет|автомобил|машин|техник|телефон|смартфон|гаджет|инструмент|летать|поезд|корабл|процессор|видеокарт/;
function freeAns(q,raw){
  if(!MODEL_Q.test(q.q.toLowerCase()))return null;
  const n=norm(raw);if(n.replace(/ /g,"").length<3)return null;
  // модель: буквы (1–8) + номер (1–5 цифр), дальше максимум два коротких хвоста: «т 300 22384382», «ак 47», «ту 154», «iphone 15 pro»
  if(!/^[a-zа-я]{1,8} ?[0-9]{1,5}[a-zа-я]{0,3}( [0-9a-zа-я]{1,10}){0,2}$/.test(n))return null;
  if(n.split(" ").some(junkWord))return null;
  return mkFree(raw.trim());
}
function mkFree(label){return{label,keys:[norm(label)],stems:[],pct:0,clever:false,free:true}}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function update(dt){
  const w=world;w.t+=dt;
  w.px+=(w.pxT-w.px)*Math.min(1,dt*2);
  w.anchor+=(w.anchorT-w.anchor)*Math.min(1,dt*2);
  w.tierA+=(w.tierAT-w.tierA)*Math.min(1,dt*5);
  const prev=w.alt;
  if(w.anim){const A=w.anim;A.t+=dt;
    if(A.type==="launch"){
      if(A.t<A.ign){w.thrust=lerp(.2,1,A.t/A.ign);w.shake=Math.max(w.shake,2+3*(A.t/A.ign));
        if(w.alt<.5)for(let i=0;i<4;i++)spawn({x:W/2+rand(-10,10),alt:w.alt,vx:rand(-160,160),vy:rand(-10,30),life:rand(1,2.4),ml:2.4,sz:rand(8,22),c:"smoke"});}
      else{const k=clamp((A.t-A.ign)/A.dur,0,1);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;w.alt=lerp(A.from,A.to,e);w.thrust=1-Math.pow(k,4)*.6;
        TIER_STEPS.forEach((p,i)=>{if(!w.passed.has(p)&&A.from+p<=w.alt+.001&&p<=A.tierP){w.passed.add(p);SFX.pass(i);w.lineFlash[p]=1}});
        if(k>=1){w.anim=null;w.thrust=0;A.done&&A.done()}}
    } else if(A.type==="fizz"){w.thrust=A.t<.6?(Math.random()*.5):0;w.shake=A.t<.6?3:0;if(Math.random()<.5)spawn({x:W/2+rand(-8,8),alt:w.alt,vx:rand(-40,40),vy:rand(-20,10),life:1.5,ml:1.5,sz:rand(6,14),c:"smoke"});if(A.t>1.2){w.anim=null;w.thrust=0;A.done&&A.done()}}
  }
  w.speed=Math.abs(w.alt-prev)/Math.max(dt,.001);
  w.cam+=(w.alt-w.cam)*Math.min(1,dt*(w.anim?12:3));
  // частицы выхлопа
  const fl=Math.max(w.thrust,w.idleFlame*(w.alt>0?1:0));
  if(fl>0.05){const n=Math.ceil(fl*6);for(let i=0;i<n;i++){const hot=Math.random()<.5;spawn({x:W/2+rand(-6,6),alt:w.alt-rand(0,8)/w.px,vx:rand(-30,30),vy:-rand(60,220)*fl,life:rand(.4,1.1),ml:1.1,sz:hot?rand(3,6):rand(6,14),c:hot?"fire":"smoke"})}}
  for(const p of w.parts){p.life-=dt;p.x+=p.vx*dt;p.alt+=(p.vy*dt)/w.px;p.vx*=.98;if(p.c==="smoke")p.sz+=dt*14;}
  w.parts=w.parts.filter(p=>p.life>0);
  for(const k in w.lineFlash)w.lineFlash[k]=Math.max(0,w.lineFlash[k]-dt*1.5);
  w.shake=Math.max(0,w.shake-dt*10);
  if(w.cam>45&&w.cam<220&&Math.random()<dt*1.5)w.meteors.push({x:rand(0,W),y:rand(-40,H*.5),vx:rand(-500,-250),vy:rand(150,300),life:.8});
  for(const m of w.meteors){m.x+=m.vx*dt;m.y+=m.vy*dt;m.life-=dt}w.meteors=w.meteors.filter(m=>m.life>0);
}

const lbKey=d=>"orb-d-"+dKey(dateOf(d));

const lbPending=()=>{const s=store.get(lbKey(TODAY));return!!(s&&s.done&&!s.lb)};
async function lbPost(path,body,ms=8000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:ctl.signal});let d=null;try{d=await r.json()}catch(e){}return{status:r.status,d}}
  catch(e){return{status:0,d:null}}finally{clearTimeout(t)}
}
// box — id блока, где спросить ник или показать ошибку; done() — после удачной отправки
async function lbSubmit(box,done,name){
  const s=store.get(lbKey(TODAY));if(!s||!s.done||s.lb)return done();
  name=(name||nickOf()).trim();if(!name)return lbAskNick(box,done,"");
  const el=$(box);if(!el)return;el.innerHTML=`<div class="next">ОТПРАВЛЯЮ В РЕЙТИНГ…</div>`;
  const{status,d}=await lbPost("/lb/submit",{pid:pid(),day:TODAY,name,log:lbLog(s)},20000);
  if(!$(box))return;
  if(status===200&&d&&d.ok){const s2=store.get(lbKey(TODAY))||s;s2.lb={score:d.score};store.set(lbKey(TODAY),s2);if(!nickOf())store.set("orb-nick",name);return done()}

  if(e==="bad_name")return lbAskNick(box,done,"ЭТОТ НИК НЕ ПОДОЙДЁТ — ПРИДУМАЙ ДРУГОЙ");
  const msg=e==="bad_set"?"ВОПРОСЫ ОБНОВИЛИСЬ — ОБНОВИ СТРАНИЦУ":e==="bad_request"?"ЭТОТ ЗАПУСК УЖЕ НЕЛЬЗЯ ОТПРАВИТЬ":e==="too_many"?"С ЭТОГО АДРЕСА СЕГОДНЯ УЖЕ МНОГО ЗАПИСЕЙ":"НЕ ВЫШЛО ОТПРАВИТЬ В РЕЙТИНГ";
  const again=!e||e==="retry"||e==="busy"||e==="rate_limited";
  $(box).innerHTML=`<div class="next">${msg}</div>${again?`<div class="rowBtns"><button class="btn small" id="lbRetry">ЕЩЁ РАЗ</button></div>`:""}`;

const LBW={};
function lbWatch(id,req,render){
  lbUnwatch(id);const w={v:null};LBW[id]=w;
  const tick=async()=>{
    if(LBW[id]!==w)return;const el=$(id);if(!el||el.closest(".hidden")){lbUnwatch(id);return}
    if(!document.hidden){const{status,d}=await lbPost("/lb",{...req,v:w.v});if(LBW[id]!==w||!$(id))return;
      if(status===200&&d&&!d.same&&Array.isArray(d.top)){w.v=d.v;render(d)}else if(w.v==null&&!(status===200&&d&&d.same))render(null)}
    w.t=setTimeout(tick,8000)};
  tick();
}
function lbUnwatch(id){const w=LBW[id];if(w){clearTimeout(w.t);delete LBW[id]}}

function lbTable(d,o={}){
  if(!d)return`<div class="lbhead"><b>${o.title||"РЕЙТИНГ"}</b></div><div class="next">НЕТ СВЯЗИ С ЦУПОМ — ПРОБУЮ ЕЩЁ</div>${o.foot||""}`;
  let h=`<div class="lbhead"><b>${o.title||"РЕЙТИНГ ДНЯ · #"+d.day}</b><small>${d.n} ${plural(d.n,"ПИЛОТ","ПИЛОТА","ПИЛОТОВ")}</small></div>`;
  if(d.me&&d.me.hidden)h+=`<div class="lbnote">твоя запись скрыта модератором</div>`;
  else if(d.me){h+=`<div class="lbme">ТЫ #${d.me.p} ИЗ ${d.n}</div>`;if(o.score!=null&&d.me.score!==o.score)h+=`<div class="lbnote">в рейтинге ${d.me.score} км — очки пересчитал сервер</div>`}

$("startBtn").onclick=()=>startGame("daily");
$("endlessBtn").onclick=()=>startGame("endless");
$("duelBtn").onclick=()=>{SFX.click();duelMenu()};
$("roomBtn").onclick=()=>{SFX.click();roomMenu()};
$("lbBtn").onclick=()=>{SFX.click();lbScreen("day")};
$("archBtn").onclick=()=>{SFX.click();archive()};
$("packBtn").onclick=()=>{SFX.click();packs()};
function archive(){let h="";for(let d=TODAY;d>=1;d--){const v=store.get("orb-d-"+dKey(dateOf(d)));const dt=dateOf(d).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});h+=`<button class="btn small" data-day="${d}"><span>#${d} · ${dt}${d===TODAY?" · СЕГОДНЯ":""}</span><small>${v&&v.done?v.score+" км":v?"не закончен":"не сыгран"}</small></button>`}
 modal(`<h3>АРХИВ ЗАПУСКОВ</h3><div class="mlist">${h}</div><div class="rowBtns" style="margin-top:12px"><button class="btn small" onclick="show('modal',false)">ЗАКРЫТЬ</button></div>`);
 $("mbox").querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{show("modal",false);startGame("daily",{day:+b.dataset.day})})}
function packs(){const ic=CAT_ICON;
 modal(`<h3>ТЕМАТИЧЕСКИЕ НАБОРЫ</h3><div class="mlist">${Object.keys(CATS).map(c=>`<button class="btn small" data-cat="${c}"><span>${ic[c]} ${CATS[c].toUpperCase()}</span><small>${Qs.filter(q=>q.cat===c).length} вопросов</small></button>`).join("")}</div><div class="rowBtns" style="margin-top:12px"><button class="btn small" onclick="show('modal',false)">ЗАКРЫТЬ</button></div>`);
 $("mbox").querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{show("modal",false);startGame("pack",{cat:b.dataset.cat});G.cat=b.dataset.cat})}
$("menuBtn").onclick=()=>{SFX.click();modal(`<h3>МЕНЮ</h3><div class="mlist">
 <button class="btn small" id="mHow"><span>${ico("help",16)} КАК ИГРАТЬ</span></button>
 <button class="btn small" id="mDaily"><span>${ico("rocket",16)} ЗАПУСК ДНЯ</span><small>#${TODAY}</small></button>
 <button class="btn small" id="mLb"><span>${ico("star",16)} РЕЙТИНГ ДНЯ</span></button>
 <button class="btn small" id="mArch"><span>${ico("clock",16)} АРХИВ</span></button>
 <button class="btn small" id="mPack"><span>${ico("grid",16)} ТЕМАТИЧЕСКИЕ НАБОРЫ</span></button>
 <button class="btn small" id="mEnd"><span>${ico("inf",16)} БЕСКОНЕЧНЫЙ РЕЖИМ</span></button>
 <button class="btn small" id="mDuel"><span>${ico("duel",16)} ДУЭЛЬ С ДРУГОМ</span></button>
 <button class="btn small" id="mRoom"><span>${ico("party",16)} КОМНАТА ДЛЯ КОМПАНИИ</span><small>до 30</small></button>
 <button class="btn small" id="mHome"><span>${ico("home",16)} НА ГЛАВНУЮ</span></button></div>`);
 $("mHow").onclick=()=>modal(howHTML());$("mDaily").onclick=()=>{show("modal",false);startGame("daily")};$("mArch").onclick=archive;$("mPack").onclick=packs;$("mEnd").onclick=()=>{show("modal",false);startGame("endless")};$("mDuel").onclick=duelMenu;$("mRoom").onclick=roomMenu;$("mLb").onclick=()=>lbScreen("day");$("mHome").onclick=()=>{show("modal",false);goHome()}};
$("sndBtn").onclick=()=>{muted=!muted;store.set("orb-mute",muted);setMuteUI();if(!muted){ac();SFX.click()}};
addEventListener("keydown",e=>{if(e.key==="Escape")show("modal",false);if(e.key==="Enter"&&!$("res").classList.contains("hidden")&&!$("res").contains(document.activeElement)){e.preventDefault();next()}});

setMuteUI();initIcons();world.px=world.pxT=pxHome();initHome();
{const dc=new URLSearchParams(location.search).get("duel");if(dc){history.replaceState(null,"",location.pathname);duelOpen(dc)}
 const rc=new URLSearchParams(location.search).get("room");if(rc)roomOpen(rc)}
addEventListener("resize",()=>{world.pxT=G?pxGame():pxHome()});
</script>
